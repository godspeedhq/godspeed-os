# PORTABLE CRYPTO ON EVERY DEVICE TARGET (2026-10-16, `sdk/tls`). The RustCrypto AES and GHASH (polyval)
# crates and dalek's curve25519 choose a SIMD path (AES-NI, CLMUL, AVX2) by asking the CPU at RUN time, and
# the x86 kernel saves no SSE or AVX state across a context switch, so a service using them would corrupt
# another's registers or fault. These cfgs force their integer-only code. Measured: without them `aes` and
# `polyval` do not compile for x86_64-unknown-none at all; with them the emitted assembly of every crypto
# crate holds no xmm/ymm/aesenc/pclmul instruction (the host build, the control, holds thousands). They
# change nothing for a crate that does not read them. Every shipping target carries them, so a port cannot
# be the one that forgot.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft", "--cfg", "curve25519_dalek_backend=\"serial\"",
]

# AArch64 variant (QEMU `virt`) - the arch-boundary demarcation test (docs/aarch64.md). The neutral
# kernel must compile for this target with ONLY arch/aarch64/ written; any error outside arch/aarch64/
# is a boundary leak. Build: cargo build -p kernel --target aarch64-unknown-none
[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    # Portable crypto: see the note above the x86 section.
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft", "--cfg", "curve25519_dalek_backend=\"serial\"",
]

# Build the kernel and services with:
#   cargo build -p kernel --target x86_64-unknown-none
#   cargo build -p godspeed-sdk --target x86_64-unknown-none
#   cargo build -p init --target x86_64-unknown-none
#
# Build the host tool with:
#   cargo build -p osdev

# RISC-V variant (QEMU `virt`, S-mode via OpenSBI) - the THIRD arch, proving the boundary generalises.
# riscv64imac = integer-only (soft-float), so no FP-enable step. Build: cargo build -p kernel --target riscv64imac-unknown-none-elf
[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "relocation-model=static",
    # Portable crypto: see the note above the x86 section.
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft", "--cfg", "curve25519_dalek_backend=\"serial\"",
]

# LoongArch64 variant (QEMU `virt`) - the FOURTH arch. softfloat = no FP-enable step.
# Build: cargo build -p kernel --target loongarch64-unknown-none-softfloat
[target.loongarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static",
]

# s390x variant (QEMU s390-ccw) - the FIFTH arch, and the first BIG-ENDIAN one.
# Build: cargo build -p kernel --target s390x-unknown-none-softfloat
[target.s390x-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static",
]

# riscv32 - a WORD-SIZE test (32-bit), not a clean bank. Reveals the kernel's 64-bit assumptions.
[target.riscv32imac-unknown-none-elf]
rustflags = ["-C", "relocation-model=static"]

# ARM 32-bit (Raspberry Pi 2 port).
# `max-page-size=0x1000`: the ARM linker defaults to a 64 KiB max page size and packs PT_LOAD
# segments without 4 KiB page-aligning them, so two segments share a page (e.g. text ending and
# rodata beginning). The kernel maps at 4 KiB granularity with per-segment permissions, so overlapping
# segments collide (the loader rejects a double-mapped page). Setting the runtime page size to 4 KiB
# makes the linker page-align each PT_LOAD, matching what x86 services already get. Benign for the
# kernel (a flat binary via objcopy), needed for the service ELFs.
[target.armv7a-none-eabi]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-z", "-C", "link-arg=max-page-size=0x1000",
    # Portable crypto: see the note above the x86 section.
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft", "--cfg", "curve25519_dalek_backend=\"serial\""]
