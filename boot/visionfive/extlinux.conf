## GodspeedOS on the StarFive VisionFive 2 Lite
##
## The bootloader is NOT on this card. SPL, OpenSBI and U-Boot all live in the board's
## 16 MB SPI flash - its own boot log says so ("Trying to boot from SPI", "Loading
## Environment from SPIFlash"). So this card supplies a kernel and nothing else, and
## wiping it cannot brick the board.
##
## It does NOT follow that the layout is free. U-Boot's environment is the compiled-in
## default ("bad CRC, using default environment") and loads from mmc 0:3 only, so the
## FAT32 partition must be PARTITION 3 - write an official StarFive image to get that
## layout. This block used to claim one plain FAT32 partition was enough; it is not,
## and the board stops at its splash screen with "** Invalid partition 3 **".
##
## These labels are APPENDED to the extlinux.conf the official image ships, so its own
## kernel stays in the menu as a fallback.

default godspeed
menu title GodspeedOS
prompt 1
timeout 30

label godspeed
	menu label GodspeedOS riscv64
	linux /godspeed-riscv64-visionfive.img
	fdt /dtbs/jh7110s-starfive-visionfive-2-lite.dtb
