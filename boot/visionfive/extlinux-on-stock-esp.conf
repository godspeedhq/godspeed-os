## /extlinux/extlinux.conf
##
## IMPORTANT WARNING
##
## The configuration of this file is generated automatically.
## Do not edit this file manually, use: u-boot-update
##
## EDITED BY HAND for GodspeedOS. The two Debian labels below are byte-identical to
## the generated ones; only `default` changed, and the `godspeed` label was appended.
## Original saved alongside as extlinux.conf.orig. Running u-boot-update will discard
## this edit.

default godspeed
menu title U-Boot menu
prompt 0
timeout 50

label l0
	menu label Debian GNU/Linux trixie/sid 6.12.5-starfive
	linux /vmlinuz-6.12.5-starfive
	initrd /initrd.img-6.12.5-starfive
	fdtdir /dtbs/6.12.5-starfive
	append root=UUID=ef509a8d-3da8-4bf4-ba56-59f00b5e02ae root=/dev/${sdev_blk} rw console=tty0 console=ttyS0,115200 earlycon rootwait stmmaceth=chain_mode:1 selinux=0

label l0r
	menu label Debian GNU/Linux trixie/sid 6.12.5-starfive (rescue target)
	linux /vmlinuz-6.12.5-starfive
	initrd /initrd.img-6.12.5-starfive
	fdtdir /dtbs/6.12.5-starfive
	append root=UUID=ef509a8d-3da8-4bf4-ba56-59f00b5e02ae root=/dev/${sdev_blk} rw console=tty0 console=ttyS0,115200 earlycon rootwait stmmaceth=chain_mode:1 selinux=0 single

label godspeed
	menu label GodspeedOS riscv64 (single hart)
	linux /godspeed-riscv64-visionfive.img
	fdt /dtbs/6.12.5-starfive/starfive/jh7110s-starfive-visionfive-2-lite.dtb
