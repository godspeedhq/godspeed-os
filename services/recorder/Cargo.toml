[package]
name = "recorder"
version = "0.1.0"
description = "Writes the events log to a file for `events persist`"
edition = "2021"

[[bin]]
name = "recorder"
path = "src/main.rs"

[dependencies]
godspeed = { path = "../../stdlib/rust" }

[features]
# Hold every client reply 2.5 s, so `osdev test quit` (backlog/fixed/89) can watch a person wait on this
# service in QEMU. TEST BUILDS ONLY.
slow-replies = []
