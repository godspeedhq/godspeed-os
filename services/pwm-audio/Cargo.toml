[package]
name = "pwm-audio"
version = "0.1.0"
description = "The Raspberry Pis' 3.5 mm audio jack: PWM fed by the DMA engine"
edition = "2021"

[[bin]]
name = "pwm-audio"
path = "src/main.rs"

[dependencies]
godspeed = { path = "../../stdlib/rust" }
# The request protocol, the test tone and `/system/services/<driver>/settings`, shared with `audio-driver` (sdk/audio).
godspeed-audio = { path = "../../sdk/audio" }
