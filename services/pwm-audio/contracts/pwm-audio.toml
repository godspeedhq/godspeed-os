# SPDX-License-Identifier: GPL-2.0-only
# THE RASPBERRY PIS (Pi 2 and Pi 4) ONLY. The 3.5 mm jack, driven by PWM and fed by the SoC's DMA engine
# (docs/audio.md, "The Pis").
#
# Not on any bus that enumerates, so named by its device kind: the kernel, granting it, routes the jack's
# two pins to the PWM and starts the PWM clock - both in SHARED blocks, so they are part of the grant and
# never this service's to touch (CLAUDE.md 12.3, as amended for audio) - then maps the PWM page and the
# DMA engine's page side by side (`map_fixed_driver_mmio`) and grants a DMA arena. The DMA page holds
# every channel, which is more than this service needs and is recorded as such; on these boards, with no
# IOMMU, it is no more reach than any DMA-capable driver has.
name    = "pwm-audio"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[placement]
core = 2

[capabilities]
hw_device   = "audio_pwm"
ipc_receive = ["pwm-audio"]
log_write   = true
# `fs` - one peer, for one file: `/audio.settings`, the volume and the mute kept across a restart.
ipc_send    = ["fs"]
