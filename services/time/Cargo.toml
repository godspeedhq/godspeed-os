[package]
name = "time"
description = "The wall clock: the hardware clock, the network time and the saved floor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "time"
path = "src/main.rs"

[dependencies]
godspeed-sdk = { path = "../../sdk/rust" }
godspeed = { path = "../../stdlib/rust" }

[features]
# Hold every client reply 2.5 s, so `osdev test quit` (backlog/fixed/89) can watch a person wait on this
# service in QEMU. TEST BUILDS ONLY.
slow-replies = []
