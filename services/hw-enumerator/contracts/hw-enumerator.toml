# SPDX-License-Identifier: GPL-2.0-only
# Hardware DISCOVERY in userspace (step D2, docs/service-ownership.md).
#
# §4.3 names six kernel responsibilities and bus enumeration is not among them. The kernel keeps only
# the PORT OPERATION - `in`/`out` are privileged instructions no service can execute - and this service
# owns what the operation MEANS: that 0xCF8 selects a PCI configuration register, how to walk a bus,
# what a class code identifies, where a device's BARs are.
#
#   kernel:         "Given a valid capability, I permit this operation."
#   hw-enumerator:  "I know what this operation means."
#
# It is a REPORTER, not a manager. It discovers what is present and where its resources are. It does
# not own devices, drive them, pick drivers, or make lifecycle policy - and it must not grow into
# doing so. That growth is the failure mode this design guards against by name.
name    = "hw-enumerator"
version = "0.1.0"

[resources.memory]
request = "4MiB"
limit   = "8MiB"

[capabilities]
ipc_receive = ["hw-enumerator"]
log_write   = true

# PCI configuration READ, through the legacy CF8/CFC port pair. The kernel enforces exactly which
# ports and which direction: a 32-bit write to 0xCF8, a 32-bit read of 0xCFC-0xCFF, nothing else.
#
# THE WRITE SIDE OF THE DATA PORT IS PERMANENTLY ABSENT, and that asymmetry is the design. CF8 selects
# which register CFC reaches, so authority to write CFC is authority to write ANY configuration
# register of ANY device on the bus - every BAR, every command register. There is no narrower form of
# it at port granularity, because the target is chosen by data rather than by the interface.
# Enumeration is inherently read-only, so it takes the read half and only that.
#
# If discovery ever needs configuration-space mutation - destructive BAR sizing is the obvious case -
# this capability MUST NOT simply be widened. A different mechanism has to be designed and justified
# on its own terms.
#
# ONE HOLDER. The pair is stateful: a write to CF8 selects, a read of CFC retrieves. Two independent
# holders do not merely race, they silently read each other's device - a wrong answer with nothing
# anywhere to say so, which is worse than a refused one (invariant 12).
#
# x86 ONLY. ARM has no port I/O address space at all; the syscalls exist there for one dispatch table
# and can only refuse. A hardware enumerator on those ports would reach its devices another way
# (device tree, ECAM), which is why the SERVICE contract is the stable thing and the capability under
# it varies by platform.
pci_cfg = true
