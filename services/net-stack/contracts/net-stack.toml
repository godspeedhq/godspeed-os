name    = "net-stack"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# net-stack is the model-AGNOSTIC half of networking (docs/networking.md): ARP/IPv4/ICMP/... over
# RAW FRAMES, talking to nic-driver through the frame interface. It touches NO hardware - it only
# sends frames to nic-driver and reads back what arrived (request/reply, §8.2), so its authority is
# just: log, a SEND cap to nic-driver, and its own endpoint for the reply.
log_write   = true
# NOT `time` (2026-10-01). This service fetched the network time and pushed it to `time`, waiting for
# the answer inside the loop every client is queued behind. The clock left: `time` asks for its own
# NTP datagram through op 12 (a UDP exchange answered when the reply arrives) and this service never
# calls `time` at all. A peer that is never sent to is a capability that buys nothing (§3.1).
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `ctx.metric()`. It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send    = ["nic-driver", "events"]
ipc_receive = ["net-stack"]
# net-stack mints a delegated SOCKET capability per open socket (§7.10, the same mechanism fs uses for
# files). resource_mint is that authority; the kernel grants it from this declaration (service_hw, T1 B).
resource_mint = true
# NO CLOCK AUTHORITY (2026-10-01). This service used to be spawned with SET_CLOCK, for an SNTP exchange it
# no longer runs and a syscall that never existed (`backlog/59`). The supervisor no longer asks for it.

# PLACEMENT IS ARCH-CONDITIONAL, so it is NOT declared here.
#
# On x86 and aarch64 this service sits on core 1. On arm32 it is unpinned: cross-core wakes are
# immediate there now (the BCM2836 mailbox doorbell), and core 0 is kept clear for `dwc2`, whose
# split transactions must hit 125 us windows.
#
# A `[placement] core` line here would be a SECOND copy of that decision, and it would be wrong on
# one of the two arches whatever value it carried - the drift Commandment III forbids. The single
# source is `ServiceConfig.preferred_core` in kernel/src/task/mod.rs, which both the boot and the
# RESTART paths consult. The comments that used to sit here saying "the kernel overrides this to
# core 0" were describing exactly that duplication, and are now unnecessary as well as stale.

[placement]
# DECLARED. The prose above argued that stating a core here would be a second copy of an
# arch-conditional decision - and it is right that ONE number cannot be correct for both arches. But
# saying nothing is not neutral: the kernel pins this service, the contract claims no opinion, and
# `scripts/contract_check.py` reads that as what RUNS differing from what is DECLARED. It failed the
# audit on exactly these three files.
#
# The convention the checker enforces resolves it: this line is the x86 value, which is what the
# reconcile compares against, and the arch-conditional lives ONCE in `ServiceConfig.preferred_core`
# (kernel/src/task/mod.rs), where arm32 puts it on core 1 beside nic-driver. The reasoning for the ARM
# choice sits beside that code rather than being restated here, so there is still one source per fact.
core = 1
