name    = "net-stack"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# net-stack is the model-AGNOSTIC half of networking (docs/networking.md): ARP/IPv4/ICMP/... over
# RAW FRAMES, talking to nic-driver through the frame interface. It touches NO hardware - it only
# sends frames to nic-driver and reads back what arrived (request/reply, §8.2), so its authority is
# just: log, a SEND cap to nic-driver, and its own endpoint for the reply.
log_write   = true
ipc_send    = ["nic-driver"]
ipc_receive = ["net-stack"]
# net-stack mints a delegated SOCKET capability per open socket (§7.10, the same mechanism fs uses for
# files). resource_mint is that authority; the kernel grants it from this declaration (service_hw, T1 B).
resource_mint = true
# ARM NOTE (BOTH ARM ports - arm32 Pi 2 and aarch64 Pi 4) (userspace-audit U15 / A5-U1 doctrine): the Pi 2 has no battery-backed RTC, so the wall
# clock has no hardware source and `date` reads zero until something sets it. net-stack runs the SNTP
# exchange, so on ARM the kernel additionally grants this service the SET_CLOCK capability BY NAME
# (`SetClock`, syscall 50 - `service_privileges` in kernel `task/mod.rs`, arch-gated to `arm` AND `aarch64`; x86's CMOS RTC
# is the authority there, so nothing holds it and the syscall is refused). SET_CLOCK is a kernel-only
# by-name grant and is deliberately NOT a contract capability - `contract_check.py` does not reconcile it.
# So on ARM the real authority of this service is the four capabilities above PLUS SET_CLOCK (set the
# machine's time of day). Stated here so a contract reader is not misled about what net-stack can reach.

[placement]
core = 1   # co-located with nic-driver (the two exchange frames constantly)
# ARM (Pi 2): the kernel overrides this to core 0, co-located with nic-driver there (which must be core 0
# for the DWC2 USB-net device), avoiding QEMU-TCG cross-core IPC latency. This x86 value stands.
