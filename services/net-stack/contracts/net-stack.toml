name    = "net-stack"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# net-stack is the model-AGNOSTIC half of networking (docs/networking.md): ARP/IPv4/ICMP/... over
# RAW FRAMES, talking to nic-driver through the frame interface. It touches NO hardware - it only
# sends frames to nic-driver and reads back what arrived (request/reply, §8.2), so its authority is
# just: log, a SEND cap to nic-driver, and its own endpoint for the reply.
log_write   = true
# NOT `time` (2026-10-01). This service fetched the network time and pushed it to `time`, waiting for
# the answer inside the loop every client is queued behind. The clock left: `time` asks for its own
# NTP datagram through op 12 (a UDP exchange answered when the reply arrives) and this service never
# calls `time` at all. A peer that is never sent to is a capability that buys nothing (§3.1).
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `gs::trace::metric` (the SDK's `metric` under it). It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send    = ["nic-driver", "events"]
ipc_receive = ["net-stack"]
# net-stack mints a delegated SOCKET capability per open socket (§7.10, the same mechanism fs uses for
# files). resource_mint is that authority; the kernel grants it because the supervisor's spawn request
# asks for RESOURCE_MINT (CLAUDE.md 13.6) - this line declares it, the request is what grants it.
resource_mint = true
# NO CLOCK AUTHORITY (2026-10-01). This service used to be spawned with SET_CLOCK, for an SNTP exchange it
# no longer runs and a syscall that never existed (`backlog/59`). The supervisor no longer asks for it.

[placement]
# Core 1 on every port, as a PREFERENCE: the supervisor's spawn row for this service asks for core 1, and
# a preference falls back to round-robin when that core is not ready (only a caller's explicit core, a
# RESTART override, is strict). That row is the source; this line restates it so
# `scripts/contract_check.py` can reconcile the two.
#
# Note 2026-10-09: the paragraphs that stood here said the decision is arch-conditional, that arm32 leaves
# this service unpinned (or puts it on core 1 beside nic-driver), and that the single source is
# `ServiceConfig.preferred_core` in kernel/src/task/mod.rs. The kernel's table now holds the supervisor
# alone, and the supervisor's row carries one core for every port.
core = 1
