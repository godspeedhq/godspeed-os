# SPDX-License-Identifier: GPL-2.0-only
# The COM2 operator/test channel, as a service rather than kernel code (finding C1-6).
#
# §4.4 forbids "developer tooling" in the kernel by name, and a 123-line command interpreter sat there
# anyway. The kernel keeps the byte read - a UART is hardware, and §11.4 already sanctions it owning a
# serial console - and this service owns what the bytes MEAN.
#
# Its authority is named here rather than implied by ring 0: SERVICE_CONTROL to kill, SPAWN to restart,
# FIRE_IRQ to inject a test interrupt, INTROSPECT to read the byte. All four are kernel by-name grants
# (finding C4-1), so this file understates them - stated plainly rather than left to be discovered.
#
# RESTART is FORWARDED to the supervisor rather than performed here (step C,
# docs/service-ownership.md). This service used to kill and then ask the KERNEL to spawn by name,
# which only worked because the kernel held every service image; restart authority is the
# supervisor's (14.4), and once an image lives there it is the only thing that can respawn it. The
# `ipc_send` below is that request path - not new authority, since SERVICE_CONTROL and SPAWN already
# let this service kill and start things directly, but the same authority routed correctly.
name    = "control"
version = "0.1.0"

[resources.memory]
request = "4MiB"
limit   = "8MiB"

[capabilities]
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `ctx.metric()`. It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send    = ["supervisor", "events"]
log_write   = true
