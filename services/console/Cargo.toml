[package]
name = "console"
version = "0.1.0"
description = "The terminal: owns the display and draws text, the cursor and scrolling"
edition = "2021"

[[bin]]
name = "console"
path = "src/main.rs"

[dependencies]
godspeed-sdk = { path = "../../sdk/rust" }
godspeed = { path = "../../stdlib/rust" }
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "size_20", "unicode-basic-latin"] }
