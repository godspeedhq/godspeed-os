name    = "console"
version = "0.1.0"

[resources.memory]
request = "4MiB"
limit   = "8MiB"

[capabilities]
# The console's own endpoint. Every console byte in the system arrives here: `ConsoleWrite` (syscall 23)
# writes serial and then enqueues the same bytes to this endpoint - a full queue parks the WRITER, as
# any send to a full endpoint does (src/main.rs) - so the transport is ordinary IPC and needs no
# capability of its own.
ipc_receive = ["console"]
# `events` - the observability sink: automatic IPC traces, plus the metric samples the SDK publishes
# for this service (`msgs.received`). It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send    = ["events"]
# The framebuffer, granted by the kernel at spawn, Normal non-cacheable + USER, because the supervisor's
# spawn request names the device kind (`hwclass::FRAMEBUFFER` in console's IMAGES row; CLAUDE.md 13.6).
# Declared here as the device this service drives, and reconciled against that row by
# `scripts/contract_check.py` so the two cannot diverge.
hw_device   = "framebuffer"
log_write   = true

[placement]
core = 0
