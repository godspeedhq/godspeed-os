name    = "nic-driver"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# nic-driver declares its device CLASS (a NIC); the kernel resolves the runtime-discovered BAR by the
# PCI scan and grants MMIO/DMA/bus-master. Reach the BAR via ctx.mmio().
#
# On x86 the device is named by its PCI CLASS CODE. 0x020000 is class 0x02 network, subclass 0x00
# ethernet - the class EVERY PCI ethernet controller reports, whoever made it. This USED to read
# `hw_device = "nic"`, and the kernel granted MMIO only to two hard-coded vendor/device IDs (Intel
# 8086:100E and Realtek 10EC:8168), so driving a third NIC needed a KERNEL REBUILD. By the class it
# needs none, which is the whole point of step D (docs/service-ownership.md §5).
#
# `hw_pci_bar = "auto"` means THE FIRST MAPPED MEMORY BAR rather than a number, because the two NICs
# already disagree: the e1000 puts its registers in BAR0 while the RTL8168 puts I/O ports there and
# its registers in BAR2. That is what the old scan did, and neither driver should have to know which
# it got. Still not an address - a rule the kernel evaluates over its own scan.
#
# ARM ignores all of this: there is no PCI bus on either Pi, so there is no class code to name and
# nothing to find it in. See the ARM NOTE below.
hw_pci_class = "020000"
hw_pci_bar = "auto"
log_write = true
# ARM32 (Pi 2) ONLY, and declared here because a communication path that exists in the kernel but not
# in the contract is exactly what Commandment IV forbids. The USB stack moved out of the kernel into the
# `dwc2` SERVICE, so this driver reaches its ethernet device by IPC (ops 0x10 INFO / 0x11 TX / 0x12 RX)
# instead of the NET_DEVICE syscalls it once used. The supervisor's spawn request carries the send cap only
# where `dwc2` is embedded (`board::NIC_PEERS`); elsewhere there is no such service and the grant is
# absent. That asymmetry is correct rather than
# sloppy: a contract states what the service NEEDS, and the OS decides whether to grant it (§13.3).
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `gs::trace::metric` (the SDK's `metric` under it). It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
# `wifi-driver` - the onboard radio of the Pi 4 and the VisionFive 2, the link's other backend
# (docs/wifi.md 2): when the cable is out and the radio is joined, this service carries net-stack's frames
# to it over the same three ops (0x10 INFO / 0x11 TX / 0x12 RX) it answers upward. Granted only where the
# bridge is built (the supervisor's `nic_radio_bridge` board fact, `board::NIC_PEERS`); the policy - the
# cable always wins - is `Carrier` in `radio.rs`, shared by every backend with a radio.
# `wifi-usb` - the USB WiFi dongle's driver, the same bridge on the Pi 2 and the PCs, and the second
# radio on the bridge boards (`wifi hardware use`); granted where that image is embedded (docs/wifi-usb.md).
ipc_send  = ["dwc2", "wifi-driver", "wifi-usb", "events"]
# OFF x86 (no PCI ethernet on any of the boards), the spawn request names the device kind `NIC` instead of
# the class code above, and the kernel resolves it per board. Note 2026-10-09: this paragraph used to say
# the kernel grants the NET_DEVICE capability BY NAME on both ARM ports (frame syscalls 42-44); nothing
# holds NET_DEVICE any more (`service_privileges` in kernel `task/mod.rs` reads `net_device: false`), and
# the syscalls have no caller (`backlog/21`). Per board:
#
# PI 2: no window and no arena. The LAN9514 is a USB device the `dwc2` SERVICE drives; this service
# reaches it over IPC (the `dwc2` peer above).
#
# PI 4: the GENET driver lives in THIS service (`src/genet.rs`), not in the kernel, so the authority takes
# the x86 shape: a fixed MMIO window (physical 0xFD58_0000, 64 KiB, reached via `ctx.mmio()`) plus a
# 64 KiB DMA arena, granted at spawn by device kind and only when the kernel's boot probe found a
# controller. The kernel's own GENET code is discovery ONLY (`arch/aarch64/genet.rs` reads one revision
# register and writes none); there is no in-kernel driver left to fall back to, which is deliberate - a
# second path that is not exercised does not stay working.
#
# VISIONFIVE 2: the on-SoC dwmac, driven here as well (`src/dwmac.rs`, whose header says what it is granted).

[placement]
# Core 1 on every port, as a PREFERENCE: the supervisor's spawn row for this service asks for core 1, and
# a preference falls back to round-robin when that core is not ready (only a caller's explicit core, a
# RESTART override, is strict). That row is the source; this line restates it so
# `scripts/contract_check.py` can reconcile the two.
#
# Note 2026-10-09: the paragraphs that stood here said the decision is arch-conditional, that arm32 leaves
# this service unpinned (or puts it on core 1 beside net-stack), and that the single source is
# `ServiceConfig.preferred_core` in kernel/src/task/mod.rs. The kernel's table now holds the supervisor
# alone, and the supervisor's row carries one core for every port.
core = 1
