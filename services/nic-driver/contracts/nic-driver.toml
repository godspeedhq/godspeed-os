name    = "nic-driver"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# nic-driver declares its device CLASS (a NIC); the kernel resolves the runtime-discovered BAR by the
# PCI scan and grants MMIO/DMA/bus-master. Reach the BAR via ctx.mmio().
#
# On x86 the device is named by its PCI CLASS CODE. 0x020000 is class 0x02 network, subclass 0x00
# ethernet - the class EVERY PCI ethernet controller reports, whoever made it. This USED to read
# `hw_device = "nic"`, and the kernel granted MMIO only to two hard-coded vendor/device IDs (Intel
# 8086:100E and Realtek 10EC:8168), so driving a third NIC needed a KERNEL REBUILD. By the class it
# needs none, which is the whole point of step D (docs/service-ownership.md §5).
#
# `hw_pci_bar = "auto"` means THE FIRST MAPPED MEMORY BAR rather than a number, because the two NICs
# already disagree: the e1000 puts its registers in BAR0 while the RTL8168 puts I/O ports there and
# its registers in BAR2. That is what the old scan did, and neither driver should have to know which
# it got. Still not an address - a rule the kernel evaluates over its own scan.
#
# ARM ignores all of this: there is no PCI bus on either Pi, so there is no class code to name and
# nothing to find it in. See the ARM NOTE below.
hw_pci_class = "020000"
hw_pci_bar = "auto"
log_write = true
# ARM32 (Pi 2) ONLY, and declared here because a communication path that exists in the kernel but not
# in the contract is exactly what Commandment IV forbids. The USB stack moved out of the kernel into the
# `dwc2` SERVICE, so this driver reaches its ethernet device by IPC (ops 0x10 INFO / 0x11 TX / 0x12 RX)
# instead of the NET_DEVICE syscalls described below. The kernel grants the send cap only on arm; on x86
# and aarch64 there is no such service and the grant is absent. That asymmetry is correct rather than
# sloppy: a contract states what the service NEEDS, and the OS decides whether to grant it (§13.3).
ipc_send  = ["dwc2"]
# ARM NOTE (userspace-audit Audit 5, A5-U1) - applies to BOTH ARM ports: on neither is there a PCIe NIC,
# so `hw_device = "nic"` resolves to nothing; instead the kernel grants this service the NET_DEVICE
# capability BY NAME (frame syscalls 42-44 - `service_privileges` in kernel `task/mod.rs`, arch-gated to
# `arm` and `aarch64`). The device behind those syscalls differs per board - Pi 2: an in-kernel DWC2
# CDC-ECM USB adapter; Pi 4: the on-board GENET Ethernet MAC - but the authority granted is identical.
# NET_DEVICE is a kernel-only by-name grant (like the SEC-audit U15 privileges) and is deliberately NOT a
# contract capability - `contract_check.py` does not reconcile it. So on either ARM port the real authority
# of this service is: NET_DEVICE (move ethernet frames) + log_write. Stated here so a contract reader is
# not misled by the x86-shaped `hw_device` line above.
#
# PI 4: none of the paragraph above applies - it describes the Pi 2 only. The GENET driver lives in THIS
# service (`src/genet.rs`), not in the kernel, so the authority takes the x86 shape after all: a fixed
# MMIO window (physical 0xFD58_0000, 64 KiB, reached via `ctx.mmio()`) plus a 64 KiB DMA arena, both
# granted by name at spawn and only when the kernel's boot probe found a controller. The kernel's own
# GENET code is now discovery ONLY (`arch/aarch64/genet.rs` reads one revision register and writes none);
# there is no in-kernel driver left to fall back to, which is deliberate - a second path that is not
# exercised does not stay working, and the unexercised one here was the one that obeyed Commandment I.
# NET_DEVICE is still granted on aarch64 and simply goes unused; the service never calls those syscalls
# on this board. The grant is unconditional because the kernel cannot see which board's backend the
# embedded binary selected, and an unused capability is a smaller problem than a driver that cannot
# reach its device.

# PLACEMENT IS ARCH-CONDITIONAL, so it is NOT declared here.
#
# On x86 and aarch64 this service sits on core 1. On arm32 it is unpinned: cross-core wakes are
# immediate there now (the BCM2836 mailbox doorbell), and core 0 is kept clear for `dwc2`, whose
# split transactions must hit 125 us windows.
#
# A `[placement] core` line here would be a SECOND copy of that decision, and it would be wrong on
# one of the two arches whatever value it carried - the drift Commandment III forbids. The single
# source is `ServiceConfig.preferred_core` in kernel/src/task/mod.rs, which both the boot and the
# RESTART paths consult. The comments that used to sit here saying "the kernel overrides this to
# core 0" were describing exactly that duplication, and are now unnecessary as well as stale.

[placement]
# DECLARED. The prose above argued that stating a core here would be a second copy of an
# arch-conditional decision - and it is right that ONE number cannot be correct for both arches. But
# saying nothing is not neutral: the kernel pins this service, the contract claims no opinion, and
# `scripts/contract_check.py` reads that as what RUNS differing from what is DECLARED. It failed the
# audit on exactly these three files.
#
# The convention the checker enforces resolves it: this line is the x86 value, which is what the
# reconcile compares against, and the arch-conditional lives ONCE in `ServiceConfig.preferred_core`
# (kernel/src/task/mod.rs), where arm32 puts it on core 1 beside net-stack. The reasoning for the ARM
# choice sits beside that code rather than being restated here, so there is still one source per fact.
core = 1
