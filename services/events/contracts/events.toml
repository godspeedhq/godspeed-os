name    = "events"
version = "0.1.0"

[resources.memory]
request = "4MiB"
limit   = "8MiB"

[capabilities]
ipc_receive = ["events"]
# No hw_mmio: `events` does NOT drive the serial port itself. Services log via the `ctx.log()` SYSCALL,
# which writes the kernel ring buffer + serial DIRECTLY (§11.4); `events` only owns its recv endpoint
# (a placeholder sink today - services/events/CLAUDE.md). The old `hw_mmio = ["0x3F8+0x8"]` here was
# never granted by the kernel - a contract stating authority the service never held (audit T1 reconcile).

[placement]
# OFF CORE 0. This service is woken by every trace event (it holds the IPC trace ring), and while it
# sat on core 0 it preempted the SHELL twice per fs request - `osdev test files` went 222/0 to 213/9
# with tracing on, and back to 222/0 with nothing changed but this number. ARM had already moved it
# for a different reason: a serial write is an un-preemptible syscall of ~9 ms per log line, which was
# wrecking the microframe timing of the USB driver sharing its core.
#
# A diagnostic sink does not belong on the interactive core, on either arch.
core = 2
