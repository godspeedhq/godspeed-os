# SPDX-License-Identifier: GPL-2.0-only
# The xHCI USB host driver, a SERVICE rather than kernel code - the move that closed Commandment I on
# the AArch64 port by deleting 2742 lines of ring-0 driver (CLAUDE.md §6.4, 2026-08-09). Pinned to core
# 2 so its MSI lands on the core that runs it (docs/power.md: co-locating the interrupt with the driver
# is what took it from 100% CPU to idle).
#
# IOMMU-confined to its DMA arena where an IOMMU exists; on a machine without one it is trust-critical
# by necessity, and the boot log says which case holds (§6.4).
name    = "xhci"
version = "0.1.0"

[resources.memory]
request = "32MiB"
limit   = "64MiB"

[capabilities]
ipc_receive = ["xhci"]
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `ctx.metric()`. It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send    = ["events"]
# The device is named by its PCI CLASS CODE - the industry-standard (class, subclass, prog-if)
# triple - not by a name the kernel was taught. 0x0C0330 is class 0x0C serial bus, subclass 0x03 USB,
# prog-if 0x30 xHCI, and it means that on every machine ever built. The kernel holds no name for it:
# the boot scan records what the bus reports and this code selects from it, so this driver is
# addable with NO KERNEL CHANGE (step D1, docs/service-ownership.md §5).
#
# `hw_pci_bar` is an INDEX, not an address - xHCI puts its registers in BAR0 where AHCI uses BAR5 -
# so the kernel still supplies the value from its own scan. Both are reconciled against the
# supervisor's spawn row by scripts/contract_check.py (Commandment III).
hw_pci_class = "0c0330"
hw_pci_bar = 0
# NO VECTOR NUMBER, deliberately. This used to read `hw_interrupt = [40]`, back when the kernel held
# a constant named XHCI_MSI_VECTOR. Routing a vector is AUTHORITY, not a setting (step C): a caller
# that could name one could ask to be handed another device's interrupts. So the driver declares
# only that it NEEDS an interrupt, and the kernel allocates one from its MSI pool at spawn and
# programs the device with it. Which vector it gets is a runtime fact, printed at boot ("pci-msi:"),
# and is not written down anywhere - exactly as the BAR address is not.
hw_pci_irq = true
log_write   = true

[placement]
core = 2
