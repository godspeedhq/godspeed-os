# SPDX-License-Identifier: GPL-2.0-only
# The EHCI USB host driver (legacy controllers; the T630 has one, the Wyse 5070 does not). Pinned to
# core 3 for interrupt locality (§12.2). Runs in IOMMU passthrough rather than confined, because it
# legitimately reaches firmware and hub regions - see CLAUDE.md §6.4 and docs/iommu.md.
name    = "ehci"
version = "0.1.0"

[resources.memory]
request = "32MiB"
limit   = "64MiB"

[capabilities]
ipc_receive = ["ehci"]
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `ctx.metric()`. It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send    = ["events"]
hw_device   = "ehci"
hw_interrupt = [41]
log_write   = true

[placement]
core = 3
