[package]
name = "block-driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "block-driver"
path = "src/main.rs"

[features]
# Force the first couple of read/write commands to fail, to exercise the bounded I/O
# retry + port-recovery path (Phase H) - QEMU never fails a real disk read. TEST BUILDS
# ONLY; production never injects faults. Enabled by `osdev test fs-ioretry`.
io-error-test = []
# Reach the USB disk through the `xhci` SERVICE (IPC) instead of the in-kernel USB stack (syscalls).
# Must be enabled TOGETHER with the KERNEL and SUPERVISOR features of the same name - the kernel's
# copy stops it driving the controller, the supervisor's spawns the service that drives it instead,
# and this one points block-driver at that service. `scripts/pi4_build.py --xhci-userspace` sets all
# three, which is the only supported way to turn it on: setting a subset gives you two drivers on one
# controller, or a block-driver talking to a service that is not there - and both halves build and

[dependencies]
godspeed-sdk = { path = "../../sdk/rust" }
