# ARM NOTE (userspace-audit A6, same class as A5-U1): on BOTH ARM ports (arm32 Pi 2 and aarch64 Pi 4) this service is ALSO granted
# USB_DISK - whole-device read/write reach over the in-kernel USB mass-storage stack (syscalls 46-49) -
# by kernel name-match, because the ARM USB stack lives in the kernel and there is no `hw_device` name
# that resolves to it. It is therefore NOT visible in the capability list below, and `contract_check.py`
# cannot see it either. Recorded here so the grant is discoverable from the contract, per the U15
# doctrine: a privilege the contract cannot express must at least be annotated where a reader looks.
name    = "block-driver"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# block-driver is an AHCI (SATA) driver: it holds the HBA's MMIO window (ABAR) + a DMA arena.
#
# It declares the device by its PCI CLASS CODE - the industry-standard (class, subclass, prog-if)
# triple - rather than by a name the kernel was taught. 0x010601 is class 0x01 mass storage,
# subclass 0x06 SATA, prog-if 0x01 AHCI, and it means that on every machine ever built. The kernel
# holds no name for it: the boot scan records what the bus reports, and this code selects from it.
# That is what makes a driver addable with NO KERNEL CHANGE (step D1, docs/service-ownership.md §5).
#
# `hw_pci_bar` is the one extra fact, because devices differ in where they put their registers: the
# AHCI spec puts them in BAR5 (`ABAR`) where xHCI and the NICs use BAR0. It is an INDEX, not an
# address - the kernel supplies the value from its own scan - which is why a caller may state it.
#
# Both are reconciled against the supervisor's spawn row by scripts/contract_check.py, so contract
# and code cannot diverge (Commandment III). The BAR ADDRESS remains the one runtime fact, never
# written down anywhere. (The retired ATA-PIO backend's `hw_pio` was removed - the contract no
# longer mis-states the driver's privilege.)
hw_pci_class = "010601"
hw_pci_bar = 5
log_write = true

# PLACEMENT IS ARCH-CONDITIONAL, so it is NOT declared here.
#
# On x86 and aarch64 this service sits on core 1. On arm32 it is unpinned: cross-core wakes are
# immediate there now (the BCM2836 mailbox doorbell), and core 0 is kept clear for `dwc2`, whose
# split transactions must hit 125 us windows and which shares that core with nothing else that logs.
#
# A `[placement] core` line here would be a SECOND copy of that decision, and it would be wrong on
# one of the two arches whatever value it carried - which is precisely the drift Commandment III
# forbids. The single source is `ServiceConfig.preferred_core` in kernel/src/task/mod.rs, which both
# the boot and the RESTART paths consult; a value that lived only here was once overridden at boot
# and not on restart, and a restarted service came back on a core where every operation failed.

# Reach the `xhci` SERVICE by IPC. This is how block-driver gets its sectors on AArch64 (Pi 4),
# where the USB stack is a userspace service and the in-kernel driver no longer exists in ANY build
# (CLAUDE.md, amendment 2026-08-09). On every other target block-driver talks to its disk through
# AHCI (x86) or the in-kernel USB syscalls (Pi 2), and this peer goes unused.
#
# The build flags this comment used to cite (`pi4_build.py --xhci-userspace`, the kernel's
# `xhci-userspace`, this service's `usb-via-xhci`) were deleted with that driver: a flag selecting
# between a compliant and a non-compliant kernel leaves the violation one build away. A contract is
# a spec artifact, so citing a flag that cannot be set sends a reader hunting for it.
#
# BOTH NAMES are declared, because the peer differs BY PORT: `dwc2` on arm32 (Pi 2), `xhci` on
# aarch64 (Pi 4), and NEITHER on x86, where this driver reaches an AHCI controller directly through
# its own MMIO window. A TOML contract has no notion of an arch, so it states the union - every peer
# this service may send to on the ports it runs on - and `contract_check.py` reconciles against that
# union. An unused send peer grants authority that is never exercised, which is a smaller problem
# than the alternative.
#
# The alternative is not hypothetical. This said `["xhci"]` alone, and when the service's config
# moved to the supervisor the three-way `#[cfg]` behind it was flattened to match - which is correct
# ONLY on the Pi 4. On the Pi 2 the driver then held a send cap to a service that does not exist
# there and none to `dwc2`, so `request_with_reply` found no send slot and returned None instantly:
# 0 sectors, no disk, `ls` broken, while dwc2 had the stick enumerated and bound the whole time.
# Every layer healthy in isolation, and the missing piece the edge between them - twice now, on two
# different boards.
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `ctx.metric()`. It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
ipc_send = ["dwc2", "xhci", "events"]

[placement]
# DECLARED. The prose above argued that stating a core here would be a second copy of an
# arch-conditional decision - and it is right that ONE number cannot be correct for both arches. But
# saying nothing is not neutral: the kernel pins this service, the contract claims no opinion, and
# `scripts/contract_check.py` reads that as what RUNS differing from what is DECLARED. It failed the
# audit on exactly these three files.
#
# The convention the checker enforces resolves it: this line is the x86 value, which is what the
# reconcile compares against, and the arch-conditional lives ONCE in `ServiceConfig.preferred_core`
# (kernel/src/task/mod.rs), where arm32 puts it on core 2, away from both dwc2 and the networking pair. The reasoning for the ARM
# choice sits beside that code rather than being restated here, so there is still one source per fact.
core = 1
