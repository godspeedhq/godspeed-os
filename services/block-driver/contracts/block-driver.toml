# ARM NOTE (userspace-audit A6, same class as A5-U1): on BOTH ARM ports (arm32 Pi 2 and aarch64 Pi 4) this service is ALSO granted
# USB_DISK - whole-device read/write reach over the in-kernel USB mass-storage stack (syscalls 46-49) -
# by kernel name-match, because the ARM USB stack lives in the kernel and there is no `hw_device` name
# that resolves to it. It is therefore NOT visible in the capability list below, and `contract_check.py`
# cannot see it either. Recorded here so the grant is discoverable from the contract, per the U15
# doctrine: a privilege the contract cannot express must at least be annotated where a reader looks.
name    = "block-driver"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
# block-driver is an AHCI (SATA) driver: it holds the HBA's MMIO window (ABAR) + a DMA arena. It
# DECLARES the device CLASS here; the kernel resolves the runtime-discovered BAR address by the PCI
# scan and grants MMIO/DMA accordingly (kernel `service_hw` / `HwClass::Ahci`, audit T1 Phase B). The
# class is reconciled against the kernel by scripts/contract_check.py, so contract and kernel cannot
# diverge (Commandment III); the BAR address stays the one runtime fact. (The retired ATA-PIO backend's
# `hw_pio` was removed - the contract no longer mis-states the driver's privilege.)
hw_device = "ahci"
log_write = true

[placement]
core = 1

# Reach the `xhci` SERVICE by IPC. Present only when the USB stack runs in userspace
# (`pi4_build.py --xhci-userspace`, which sets the kernel's `xhci-userspace` and this service's
# `usb-via-xhci`); on every other build block-driver talks to its disk through AHCI (x86) or the
# in-kernel USB syscalls (Pi 2), and this peer goes unused.
#
# It is declared UNCONDITIONALLY here while the kernel declares it under `cfg(feature)`, because a
# TOML contract has no notion of a build feature and `contract_check.py` compares one text against
# the other. The honest reading is "block-driver MAY send to xhci"; an unused send peer grants
# authority that is never exercised, which is a smaller problem than the alternative - the missing
# edge cost a full debugging round on the Pi 4, where every service looked healthy in isolation and
# the disk was simply unaddressable.
ipc_send = ["xhci"]
