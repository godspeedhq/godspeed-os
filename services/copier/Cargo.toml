[package]
name = "copier"
version = "0.1.0"
description = "Copies and deletes in the background for the shell's `background` command"
edition = "2021"

[[bin]]
name = "copier"
path = "src/main.rs"

[dependencies]
godspeed-sdk = { path = "../../sdk/rust" }
godspeed = { path = "../../stdlib/rust" }
godspeed-audio = { path = "../../sdk/audio" }

[features]
# Hold every client reply 2.5 s, so `osdev test quit` (backlog/89) can watch a person wait on this
# service in QEMU. TEST BUILDS ONLY.
slow-replies = []
