# SPDX-License-Identifier: GPL-2.0-only
# `copier` - copies one file, detached from the prompt, so a long copy does not own the console.
#
# NOT SPAWNED AT BOOT. The shell starts it on `background <cmd>` (copy, delete, check, scrub, churn -
# `CLAUDE.md` here) and it idles until told
# what to copy - the same shape as `recorder` (`events persist start`): absent from the supervisor's
# `MANAGED` set, so nothing restarts it, and a zero-kernel-change feature.
#
# It is deliberately NOT restarted on death. A respawned copier would not know what it was copying,
# so it would be alive and copying nothing while `jobs` said `running` - worse than dead. The shell
# sees the death as the job failing, which is the truth.
#
# WHAT IT CANNOT DO IS THE POINT. No `console_push`, so a detached job cannot inject keystrokes into
# the shell's input. It CAN write to the console, as every task can through `log_write` below; it
# stays off the prompt by convention - it never calls `gs::io` - not because a capability stops it.
# No `spawn`, no `reboot`, no network. `fs` is its whole reach, which is strictly less than the
# shell's own authority - the thing that would be handed to a job that ran inside the shell's loop.
name    = "copier"
version = "0.1.0"

[resources.memory]
request = "8MiB"
limit   = "16MiB"

[capabilities]
ipc_receive = ["copier"]
# `fs` - both ends of the copy. The source is read and the destination written through the same
# service, so the job needs exactly one peer.
# `fs` for the files, and the board's audio driver for the "done" sound a finished job makes
# (`board::COPIER_PEERS`: `audio-driver` on the PCs, `pwm-audio` on the Pis).
ipc_send    = ["fs", "audio-driver", "pwm-audio"]
log_write   = true
