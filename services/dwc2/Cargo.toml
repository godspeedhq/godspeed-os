[package]
name = "dwc2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dwc2"
path = "src/main.rs"

[features]
# Mirrors the kernel driver's gate: QEMU's DWC2 wants a plain physical DMA address, real BCM2836
# silicon wants the VideoCore bus alias. Same source, both targets.
qemu = []

[dependencies]
godspeed-sdk = { path = "../../sdk/rust" }
# `gs::driver` (docs/driver-library.md): the bounded waits.
godspeed = { path = "../../stdlib/rust" }
# `godspeed_wifi::usbfn`: the radio function protocol this host serves to `wifi-usb` (docs/wifi-usb.md).
# Constants only; nothing of 802.11 is linked into this service.
godspeed-wifi = { path = "../../sdk/wifi" }
