# SPDX-License-Identifier: GPL-2.0-only
# ARM32 (Raspberry Pi 2) ONLY. The DWC2 USB host, moved out of the kernel into a service. It drives the
# hub, the keyboard, mass storage and USB-Ethernet, so `block-driver` and `nic-driver` both name it as a
# peer and it is watched for restart (C5-1) - its permanent death would take storage, input and the
# network with it.
#
# Its real authority is wider than this file can express: a fixed MMIO window and DMA arena granted at
# spawn by device kind (`hwclass::DWC2`), and CONSOLE_PUSH to deliver keystrokes - both carried in the
# supervisor's spawn request (CLAUDE.md 13.6), not contract capabilities. (Note 2026-10-09: this said
# USB_DISK too, and called these kernel by-name grants (C4-1); nothing holds USB_DISK now, and the
# kernel grants no service anything by name.)
name    = "dwc2"
version = "0.1.0"

[resources.memory]
request = "32MiB"
limit   = "64MiB"

[capabilities]
ipc_receive = ["dwc2"]
# `events` - the observability sink: automatic IPC traces, plus the metric samples this service
# publishes with `gs::trace::metric` (the SDK's `metric` under it). It is the ONLY gate on both: holding this send cap is what turns
# tracing on, and lacking it costs one relaxed load per call and nothing else. Emission is
# `try_send` with the result discarded, so the sink can never slow or fail this service.
# `supervisor` - the USB device report (`usbdev`): the WiFi dongle attached or not, so its driver is
# started and stopped with it (docs/usb-device-drivers.md).
ipc_send    = ["events", "wifi-usb", "supervisor"]
hw_device   = "dwc2"
hw_interrupt = [41]   # 0x29, the BCM2836 USB line
log_write   = true

[placement]
core = 0
