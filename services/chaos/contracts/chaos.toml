# SPDX-License-Identifier: GPL-2.0-only
# `chaos` is the fault injector: it kills services, storms spawns, and floods queues to prove the system
# recovers (Commandment II). It needs SERVICE_CONTROL to kill and SPAWN to storm. Like all of its
# authority, they come from the supervisor's spawn request (chaos's IMAGES row: SPAWN, INTROSPECT,
# SERVICE_CONTROL, ACQUIRE_ANY, and the console-read flag), never from this file (CLAUDE.md 13.6) -
# and no longer by name in the kernel, which was finding C4-1. SPAWN, INTROSPECT and ACQUIRE_ANY have
# no contract key, so what is written here is still not the whole of it.
name    = "chaos"
version = "0.1.0"

[resources.memory]
request = "4MiB"
limit   = "8MiB"

[capabilities]
# `supervisor` (step C, docs/service-ownership.md): chaos spawns services (mem-pressure, the
# spawn-storm), and a service whose image the supervisor owns cannot be spawned by name through the
# kernel. `ctx.spawn` routes through this peer automatically when it is present. Not new authority -
# chaos already holds SPAWN and SERVICE_CONTROL - the same authority routed to the principal that can
# act on it.
ipc_send    = ["supervisor"]
ipc_receive = ["chaos"]
# DECLARED, not newly granted - the comment above already says chaos "holds SPAWN and
# SERVICE_CONTROL", and now the machine can read it too.
#   `service_control` - killing services is the entire point of Maximum Carnage (Commandment II)
# SPAWN has no contract key (schema: DEAD KEY); it rides the supervisor's spawn request.
service_control = true
log_write   = true

[placement]
core = 0
