name    = "fs"
version = "0.1.0"

[resources.memory]
request = "16MiB"
limit   = "32MiB"

[capabilities]
ipc_receive = ["fs"]
ipc_send    = ["block-driver", "events"]
log_write   = true
# fs mints a delegated FILE capability per open file (§7.10, file-as-capability). resource_mint is the
# authority to mint those. The kernel grants it from the supervisor's spawn request (fs's IMAGES row
# carries `privbits::RESOURCE_MINT`), never from this file (CLAUDE.md 13.6); this declares it, and
# `IV-contract-authority` checks the two agree.
resource_mint = true

[placement]
core = 1
