# SPDX-License-Identifier: GPL-2.0-only
# The user's interface, and a capability broker (Appendix B.3) - not a Unix shell: no fork, no exec, no
# inherited descriptors. It reads the console, and either answers itself or asks a service.
#
# Restartable like everything else: a crash gives a fresh prompt and loses the in-flight command, not
# the session (§6.2). Its CONSOLE_READ, SERVICE_CONTROL, REBOOT and SPAWN authority is granted by name
# in the kernel (C4-1), so this file understates what it can do.
name    = "shell"
version = "0.1.0"

[resources.memory]
request = "4MiB"
limit   = "8MiB"

[capabilities]
# `time` (clock slice 2): the wall clock is a service, so `date` and the boot floor ask it.
# `supervisor` (step C, docs/service-ownership.md): the shell's `spawn` command asks the SUPERVISOR
# to start a service, not the kernel. Once an image lives in the supervisor the kernel has no row to
# spawn it from. Not new authority - the shell already holds SPAWN, SERVICE_CONTROL, ACQUIRE_ANY and
# REBOOT - the same authority routed to the principal that can actually act on it (14.4).
#
# This is SIX peers, which is MAX_SEND_PEERS. A seventh needs that bound raised deliberately.
ipc_send    = ["block-driver", "fs", "time", "console", "events", "supervisor"]
ipc_receive = ["shell"]
log_write   = true

[placement]
core = 0
