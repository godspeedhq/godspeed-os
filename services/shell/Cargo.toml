[package]
name = "shell"
version.workspace = true   # inherits the OS version so the `version` command shows it (single source)
edition = "2021"

[[bin]]
name = "shell"
path = "src/main.rs"

[features]
# Diagnostic only, OFF by default. Prints capability IDENTITY across the file-cap invoke path
# (`[fcapr]` lines) while the post-chaos escalation is hunted. It sits on the file-capability path
# alone, so it costs nothing on other work TODAY - but §7.10 means real file I/O will run through that
# path eventually, at which point it would become per-request logging on every read and write. Hence a
# feature rather than a comment promising to remove it.
# Turned on for every crate at once by `scripts/pi4_build.py --fcap-diag`; never set it by hand in one
# crate, for the same reason the old xhci-userspace split was a footgun.
fcap-diag = []

[dependencies]
godspeed-sdk = { path = "../../sdk/rust" }
