[package]
name = "kernel"
version.workspace = true
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"
# Do not attempt to compile the no_std binary for cargo test - only the lib
# target (pure-logic modules, host-compiled) is unit-testable.
test = false

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
bitflags = { version = "2", default-features = false }
# portable-atomic: AtomicU64 on every target - native (zero-cost) where the ISA has 64-bit atomics
# (x86/x86_64, ARMv7 LDREXD, all 64-bit ISAs), and a lock-based shim on 32-bit RISC-V (RV32A has only
# 32-bit atomics). This is the ONE thing the kernel needed for 32-bit word-size portability.
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
# Antialiased Noto Sans Mono raster glyphs for the framebuffer console (fb.rs).
# no_std, pure const data (no alloc, no float). Only the Regular weight, one size,
# and Basic-Latin are compiled in to keep the rodata small. Box-drawing glyphs are
# drawn procedurally in fb.rs (the font's Basic-Latin range has no U+2500 block).
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "size_20", "unicode-basic-latin"] }

# Limine is the x86 boot protocol, used only by arch/x86_64/. Gate it to x86 so the kernel builds for
# the non-x86 arches (aarch64 / riscv64 / loongarch64 / s390x), where Limine does not apply and its
# crate does not even compile (it rejects unsupported target architectures at build time).
[target.'cfg(target_arch = "x86_64")'.dependencies]
limine = "0.6"

[dev-dependencies]
# Only used by the lib target (host-compiled, std available).
# The bare-metal bin target has test = false so proptest never touches no_std builds.
proptest = "1"

[profile.dev]
panic = "abort"

[features]
# Target the Raspberry Pi 4 Model B (BCM2711) rather than QEMU's `virt` machine, for the aarch64 build.
# Selects the 0x80000 flat-load linker script and the BCM2711 peripheral base (PL011 at 0xFE201000);
# without it the aarch64 build stays the QEMU `virt` boundary-demarcation target it has been.
pi4 = []
# Force `map_in_active_tables` to fail at the MMIO call sites (ioapic, pci MSI-X), so the error paths
# added for kernel-audit A9-2 are actually EXERCISED rather than merely reasoned about. Those paths are
# otherwise unreachable without exhausting the frame allocator, which cannot be arranged at boot.
# Commandment IX: "If recovery cannot be tested, it does not exist." Off by default; test builds only.
# See `arch/x86_64/pci.rs::msi_ordering` and `docs/kernel-audit.md` Audit 9.
mmio-map-fault-test = []
# Inject synthetic memory banks that extend past the identity-map limit, so `memmap`'s clamp is
# EXERCISED rather than merely reasoned about. The clamp matters on an 8 GiB Pi 4, whose firmware
# reports banks above 4 GiB that the low-4-GiB identity map does not reach - recording those as usable
# would hand the allocator RAM with no translation. QEMU's `raspi4b` is fixed at 2 GiB, so the
# condition cannot be reached by configuration. Commandment IX: "If recovery cannot be tested, it does
# not exist." Off by default; test builds only. See `arch/aarch64/memmap.rs`.
memmap-clamp-test = []
# Run the NEUTRAL scheduler over 3 spinning kernel tasks on the Pi 4 (arch/aarch64/sched_demo.rs),
# preempted by the 100 Hz generic timer. The aarch64 twin of `arm-sched-demo`. Gated because it does
# not return - scheduler::run IS the idle loop - so it replaces the rest of the boot.
pi4-sched-demo = []
# Spawn a REAL service (the logger) through the neutral spawn path on the Pi 4
# (arch/aarch64/sched_spawn.rs) and run it under the scheduler. The aarch64 twin of
# `arm-sched-spawn`. Exercises the ELF loader, per-task page tables, the instruction-cache
# maintenance a loader needs, the kstack pool, cap wiring, and the SDK ABI - in one call.
pi4-sched-spawn = []
# The real OS bootstrap on the Pi 4: the kernel makes its ONE direct spawn (the supervisor), which then
# spawns the services - including the shell, with a CONSOLE_READ cap wired to the PL011 receiver. The
# aarch64 twin of `arm-supervisor`. This is the build that gives a `gsh>` prompt.
#
# **This is what `--features pi4` does by default** - it is the OS, not an option. The feature is kept
# so the intent can still be named explicitly, but it does not have to be passed: the boot runs the
# supervisor unless a demo feature above claims the machine instead. Defaulting the other way (a build
# that boots and halts) meant the deployable image and the tested image were different builds, which is
# exactly the gap a `--features` flag is good at hiding.
pi4-supervisor = []
# Embed the ping/pong DEMO services in the Pi 4 image. They pace with `yield_cpu`, not a sleep, so they
# emit ~500 log lines a second - proof of IPC, but it buries the shell prompt. Off by default so the
# shell is usable; on when the point is to watch IPC.
pi4-demo-services = []
# Bring up the Pi 4's other three cores. ON by default in `scripts/pi4_build.py`: six consecutive QEMU
# boots reach a shell on four cores and a carnage run survives it. Still a separate feature so a
# single-core image remains one flag away if a hardware fault ever needs bisecting against it.
pi4-smp = []
# Hand the Pi 4's GENET ethernet MAC to the `nic-driver` SERVICE, and take it out of the kernel.
#
# `kernel/src/arch/aarch64/genet.rs` is a ~1500-line ethernet driver living in ring 0, which is a
# direct breach of Commandment I ("thou shalt not expand the responsibilities of the kernel - use a
# service") and of §4.4's kernel anti-scope. x86 has never had this problem: its NIC driver is a
# restartable, IOMMU-confinable userspace service, and this feature is aarch64 catching up.
#
# With it on, the kernel's whole involvement with ethernet is the boot probe: it establishes that the
# controller answers, sets `NIC_FOUND` so the spawn path grants the arena, and stops. The service gets
# the register window (`map_fixed_driver_mmio`) and the DMA arena, and drives the MAC itself through
# the SDK's `Mmio`/`Dma` wrappers with no `unsafe` of its own.
#
# It is a feature rather than the default for one reason: the in-kernel driver is HARDWARE-VERIFIED on
# a real Pi 4 and the service one is not yet, and a working machine does not get replaced by an
# unproven one on the strength of an argument. Build both sides with it (`pi4_build.py
# Hand the Pi 4's VL805 USB host controller to the `xhci` SERVICE, and take it out of the kernel.
#
# `kernel/src/arch/aarch64/xhci.rs` is ~2700 lines of USB stack living in ring 0 - controller
# bring-up, TRB rings, hub enumeration, a HID keyboard and Bulk-Only-Transport mass storage - which
# Commandment I forbids in one sentence and §4.4 forbids again by name. x86 has never had the problem:
# `services/xhci` has always been a restartable userspace service. That file's own header already said
# what should happen ("when device IRQs reach userspace this becomes a service and the existing `xhci`
# service is what it becomes"); this feature is that sentence made true.
#
# With it on, the kernel's whole involvement with USB is the PCIe bring-up it already does: train the
# link, ask the VideoCore to reload the VL805's firmware, assign the BAR, publish it in `pci::XHCI_*`,
# and stop. The spawn path then hands the SERVICE that BAR and a DMA arena through the SAME neutral
# code x86 uses - there is no aarch64-specific grant, because a discovered BAR is exactly the shape
# that path was written for (unlike GENET, which is soldered to the SoC and needed
# `map_fixed_driver_mmio`).
#
# TWO THINGS ARE LOST WITH IT ON, and they are lost loudly rather than papered over:
#   * USB MASS STORAGE. `services/xhci` is HID-only - it explicitly releases the slot of any device
#     that is not a keyboard, mouse or hub - so with the in-kernel stack gone there is no BOT/SCSI
#     implementation anywhere. `usb_disk_*` therefore answers "absent", `block-driver` reports no disk
#     and `fs` serves 0 sectors. Closing that gap means teaching the SERVICE bulk transfers; it does
#     NOT mean a kernel syscall, which is what the in-kernel driver was.
#   * INTERRUPT-DRIVEN keyboard latency. Nothing programs the VL805's MSI on this board yet
#     (`pci::program_xhci_msi` is a stub), so the service's `recv_timeout` falls through on its
#     timeout instead of on an IRQ. That is the same ~250 ms idle poll the in-kernel driver had (it
#     masked the interrupter outright), so nothing regresses; it is simply not yet an improvement.
#
# It is a feature rather than the default because the in-kernel driver is HARDWARE-VERIFIED on a real
# Pi 4 and the service one is not, and a working machine does not get replaced by an unproven one on
# the strength of an argument. (GENET went through the same staging and is now the only path.) Build
# both sides with it
# Run the minimal ARM logger spawn at boot (arch/arm/spawn.rs). Off by default: the spawn currently
# reaches PL0 and issues real syscalls, but the kernel's cap-table spinlock (LDREX/STREX) does not yet
# work under the service's dual-mapped address space, so the boot would block. Gated so the default
# image boots clean while the spawn is exercised + iterated on with this feature.
arm-spawn-logger = []
# Run the neutral scheduler over 3 cooperative kernel tasks on ARM (arch/arm/sched_demo.rs).
arm-sched-demo = []
# Run a real USER service (the logger) THROUGH the neutral scheduler on ARM, preemptively, alongside
# spinning kernel tasks (arch/arm/sched_user.rs). Proves per-task address spaces + user-mode preemption.
arm-sched-user = []
# Run TWO USER services under the scheduler at once (arch/arm/sched_ipc.rs). Proves the banked-register
# trap frame (SP_usr/LR_usr per task) and is the base the real IPC send/recv proof grows on.
arm-sched-ipc = []
# Spawn a service (logger) through the NEUTRAL spawn path on ARM (arch/arm/sched_spawn.rs). Proves
# task::spawn_service_with_config - the machinery the supervisor's spawn syscall uses - works on ARM.
arm-sched-spawn = []
# The real OS bootstrap: kernel spawns the SUPERVISOR, which spawns the services (arch/arm/sched_supervisor.rs).
arm-supervisor = []
# The interactive shell on ARM: gsh> prompt reading serial input (arch/arm/sched_shell.rs).
arm-shell = []
# Hands-off chaos demo: a few seconds after boot the kernel INJECTS `chaos max-carnage all-services 10`
# (+ confirm) into the input ring, so a serial-output-only setup (no keyboard) still runs + shows the
# storm. Build with `arm-supervisor,arm-autochaos`.
arm-autochaos = []
# Target QEMU's raspi2b emulation rather than real Pi 2 hardware. Currently only changes the DWC2 USB
# DMA bus-address translation: QEMU's emulated DWC2 addresses ARM system RAM directly (identity), while
# real BCM2836 silicon sees RAM through the VideoCore uncached alias 0xC000_0000 (arch/arm/dwc2.rs).
# OFF by default so the shipped image is hardware-correct; scripts/arm_run.py passes it for emulation.
qemu = []

# Deliberately take a data abort during arm32 boot, to PROVE the exception vectors
# fire (a fault path never observed firing is not evidence). The ARM twin of the x86
# adversarial fault tests (§22 A14/A15/C2). Never enabled in a normal boot.
arm-fault-test = []

# Build the kernel with a deliberately invalid SUPERVISOR ELF to trigger the TCB
# failure path when the kernel spawns the supervisor directly (§6.2, §22 Test 1B).
# Only used by `osdev test identity`.
test-bad-supervisor = []

# Build the kernel in ELF-loader fuzz mode (§22 Fuzz F3).  Calls loader::run_elf_fuzz()
# on 77 malformed ELF byte sequences early in BSP init, prints "fuzz: F3 pass",
# then halts.  Only used by `osdev test fuzz`.
test-bad-elf = []

# Build the kernel in brutal ELF-loader fuzz mode (§22 Fuzz BF3).  Calls
# loader::run_elf_fuzz_brutal() on 263 malformed inputs (13 specific + 200
# random single-byte + 50 multi-byte mutations).  Only used by `osdev test fuzz-brutal`.
test-bad-elf-brutal = []

# Confine the first DMA-capable driver (xhci) to an EMPTY IOMMU domain instead of
# its arena, so its normal init DMA faults - a deterministic live proof that the
# IOMMU blocks + logs out-of-arena DMA (§22 Test 12, H1 §6.4). Only used by
# `osdev test iommu` (boots with -device amd-iommu); off in every normal build.
iommu-fault-test = []

[profile.release]
panic = "abort"
