name: build

on:
  workflow_dispatch:  # paused: re-add push/pull_request when CI minutes are available

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # port_scope_check.py diffs the branch against its merge base with main, which a shallow
          # clone does not have. It reports that it could not run rather than passing quietly, so a
          # depth-1 checkout would turn this job red for the wrong reason.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show

      # Services must be built before the kernel: kernel/build.rs embeds service
      # ELF bytes via include_bytes!(env!("SVC_*_ELF")), so the service binaries
      # must exist in target/ before the kernel crate compiles.
      - name: Build services (bare-metal)
        # THE SUPERVISOR EMBEDS THE OTHER SERVICES, so they must be built first. `--workspace` gives
        # cargo no ordering guarantee between members, so a plain workspace build can reach
        # `supervisor/build.rs` before `pong` exists and panic - which is what broke this workflow
        # silently for months while it was paused and nothing ran it.
        run: |
          cargo build --target x86_64-unknown-none --workspace \
            --exclude osdev --exclude kernel --exclude supervisor
          cargo build --target x86_64-unknown-none -p supervisor

      - name: Build kernel (bare-metal)
        run: cargo build --target x86_64-unknown-none -p kernel

      - name: Build osdev (host)
        run: cargo build -p osdev

      - name: Clippy services (bare-metal)
        # Same ordering, same reason: clippy runs the build scripts.
        run: |
          cargo clippy --target x86_64-unknown-none --workspace \
            --exclude osdev --exclude kernel --exclude supervisor
          cargo clippy --target x86_64-unknown-none -p supervisor

      - name: Clippy kernel (bare-metal)
        run: cargo clippy --target x86_64-unknown-none -p kernel

      - name: Clippy osdev (host)
        run: cargo clippy -p osdev

      - name: Validate service contracts
        run: cargo run -p osdev -- validate

      # The self-test runs FIRST and separately: it proves the checks still fire. A weakened check
      # reports PASS over code it stopped looking at, and only the probe corpus can tell.
      - name: Commandment checks - self-test (is the enforcement layer intact?)
        run: python3 scripts/commandments.py --selftest

      - name: Commandment checks
        run: python3 scripts/commandments.py

      - name: Unsafe audit check
        run: python3 scripts/unsafe_check.py

      - name: Contract reconcile check (contract vs kernel service_config)
        run: python3 scripts/contract_check.py

      - name: Arch-boundary check (no arch-specific code in neutral layers)
        run: python3 scripts/arch_boundary_check.py

      # Silent on any branch that does not add an ISA. On one that does, it is the only check that
      # can see an edit to a file `docs/porting.md` marks do-not-touch - the others all ask whether
      # a RULE was broken, and an ordinary neutral-kernel edit breaks none of them.
      - name: Port-scope check (a port writes arch/<isa>/ and eleven named files, nothing else)
        run: python3 scripts/port_scope_check.py

      - name: "Dash check (ASCII hyphen only, CLAUDE.md section 21)"
        run: python3 scripts/dash_check.py

      # A CRLF `extlinux.conf` boots nothing on the VisionFive while showing a perfect menu
      # (backlog/26). CI runs on Linux, where a checkout is LF and this passes trivially - that is
      # the point: it catches a CRLF file COMMITTED from a Windows tree before it reaches a card.
      - name: "Line-ending check (files a bootloader reads must be LF)"
        run: python3 scripts/line_ending_check.py

      - name: Doc reference check (no doc points at a file that does not exist)
        run: python3 scripts/doc_refs.py

      - name: Fact check (a number a doc restates must match the code that owns it)
        run: python3 scripts/facts_check.py

      # The backlog index promised "this is the index" while entries 33-38 were linked from
      # nowhere. doc_refs checks a citation resolves; this checks an ENTRY is reachable.
      - name: Backlog check (every entry is reachable from the backlog index)
        run: python3 scripts/backlog_check.py

      - name: Site check (the hand-written pages still describe the real repository)
        run: python3 scripts/site_check.py

      - name: Unit tests (kernel pure-logic)
        run: python3 scripts/test_report.py

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-v1

      - name: Security audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      - name: Miri - kernel pure-logic
        env:
          # proptest's FileFailurePersistence calls getcwd; disable Miri's
          # filesystem isolation so it can resolve the path without aborting.
          MIRIFLAGS: -Zmiri-disable-isolation
          # Miri is ~100-1000x slower than native. Set cases to 1 per
          # property - enough for UB detection. Full 256 cases run in the
          # regular cargo test step.
          PROPTEST_CASES: 1
        run: cargo miri test -p kernel --lib

      - name: Unsafe surface report (cargo-geiger)
        run: |
          cargo install cargo-geiger --locked 2>/dev/null || true
          cd kernel && cargo geiger 2>&1 || true
