name: build

on:
  workflow_dispatch:  # paused: re-add push/pull_request when CI minutes are available

# REVIVED 2026-10-28 (backlog/fixed/53). This workflow sat paused and red for five months: it built the tree
# with its own hand-ordered `cargo build` steps and ran its own hand-kept list of fourteen checkers, and
# both drifted from what a local build does - the supervisor came to need `pong` first, the checker
# list fell behind `EXTRA_CHECKS`, and nothing ran it to notice. It now builds the way a developer does,
# through `osdev build`, which orders the crates and runs every gate the local build runs (`EXTRA_CHECKS`
# and the commandments, read from one list). A checker added there is in CI the same day, by construction.
#
# Proved on Ubuntu 24.04 under WSL from a fresh clone before it was committed, so dispatching it spends CI
# minutes on a build already known to pass, not on finding the next layer.

jobs:
  build:
    name: Build every port and run every gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # port_scope_check.py diffs the branch against its merge base with main, which a shallow
          # clone does not have. It reports that it could not run rather than passing quietly, so a
          # depth-1 checkout would turn this job red for the wrong reason.
          fetch-depth: 0

      - name: Install Rust toolchain (rust-toolchain.toml pins the date and every target)
        run: rustup show

      # PIN PYTHON to the declared floor (README.md Requirements, held by scripts/python_floor_check.py), so
      # the enforcement layer runs on the oldest Python it promises. `osdev` runs the checkers as `python`,
      # which setup-python provides.
      - name: Install Python (the declared floor)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # ONE build path. `osdev build` builds the services in the order the supervisor's embedding needs,
      # then the kernel, and runs `EXTRA_CHECKS` and the commandments (self-test first). It is what every
      # developer runs, so it cannot be green here and red at a desk, or the other way round.
      - name: Build x86-64 and run every gate (osdev build)
        run: cargo run -p osdev -- build

      # `rust-objcopy` turns the Arm and RISC-V kernels into flat images, and `rust-objdump` is what the
      # stack-fit check reads every service with; both ship in cargo-binutils, a cargo install rather
      # than a rustup component - the same step `release.yml` takes. Without it every board build stops
      # at "STACK-FIT CHECK CANNOT RUN" (found replaying this job under WSL, 2026-10-28).
      - name: Install cargo-binutils (rust-objcopy, rust-objdump)
        run: cargo install cargo-binutils --locked

      # The other three ports, through the one board script (CLAUDE.md 5). Each runs the same gates first.
      - name: Build the Raspberry Pi 2 image
        run: python scripts/board.py pi2
      - name: Build the Raspberry Pi 4 image
        run: python scripts/board.py pi4
      - name: Build the VisionFive 2 Lite image
        run: python scripts/board.py visionfive

      - name: Validate service contracts
        run: cargo run -p osdev -- validate

      # Clippy in RELEASE, after `osdev build`: the kernel `include_bytes!`-embeds the supervisor, and the
      # supervisor embeds every service, so clippy needs the images that build produced - the release
      # ones. A debug clippy looks for a debug supervisor nothing built (backlog/fixed/53's third layer).
      - name: Clippy services (bare-metal)
        run: |
          cargo clippy --release --target x86_64-unknown-none --workspace \
            --exclude osdev --exclude kernel --exclude supervisor
          cargo clippy --release --target x86_64-unknown-none -p supervisor

      - name: Clippy kernel (bare-metal)
        run: cargo clippy --release --target x86_64-unknown-none -p kernel

      - name: Clippy osdev (host)
        run: cargo clippy -p osdev

      - name: Unit tests (kernel pure-logic)
        run: python scripts/test_report.py

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-v1

      - name: Security audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      - name: Miri - kernel pure-logic
        env:
          # proptest's FileFailurePersistence calls getcwd; disable Miri's
          # filesystem isolation so it can resolve the path without aborting.
          MIRIFLAGS: -Zmiri-disable-isolation
          # Miri is ~100-1000x slower than native. Set cases to 1 per
          # property - enough for UB detection. The full 256 cases run in
          # `cargo test -p kernel --lib`, which this workflow does not run:
          # scripts/host_test_check.py runs it on every osdev build (backlog/90 E3).
          PROPTEST_CASES: 1
        run: cargo miri test -p kernel --lib

      - name: Unsafe surface report (cargo-geiger)
        run: |
          cargo install cargo-geiger --locked 2>/dev/null || true
          cd kernel && cargo geiger 2>&1 || true
