name: release

# Builds every release artefact and attaches it to the GitHub release, so images
# stop being produced on one developer's laptop and pushed by hand.
#
# WHY THIS EXISTS AS A GATE AND NOT JUST A CONVENIENCE: building locally produced
# artefacts that were MIXED. A branch was switched while a build ran, cargo
# re-stamped some crates and not others, and two images ended up containing
# components built from different commits. They looked perfectly normal - right
# sizes, right names. The `verify` step below is the answer to that, and it is the
# reason this workflow is worth its minutes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.16.0)'
        required: true
      overwrite_published:
        description: 'Replace assets on an ALREADY-PUBLISHED release (destructive - normally leave false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write          # needed to upload assets onto the release

env:
  # The Limine version this project tracks. Pinned deliberately: a bootloader that
  # silently moves is a boot failure nobody can bisect. Matches what the README
  # tells a human to download, and what tools/limine reports locally (12.3.1).
  LIMINE_VERSION: v12.3.1

jobs:
  artefacts:
    name: Build release artefacts
    # WINDOWS, to match the machine these builds are developed and hardware-tested on.
    # Compiler AND platform both have to match or the artefacts differ from what the
    # developer sees: a Linux runner produced a RISC-V image 88 KiB adrift of a local
    # build of the identical commit. `runs-on` fixes half of that; the pinned toolchain
    # in rust-toolchain.toml fixes the other half.
    runs-on: windows-latest
    defaults:
      run:
        # The steps below are POSIX shell. Windows runners ship Git Bash, so they run
        # unchanged rather than being rewritten in PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAG, not the branch tip. The kernel stamps
          # `git rev-parse --short HEAD` into itself and the shell prints it as
          # `version`, so an artefact built from a later commit would contradict
          # its own release notes.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the version and commit under build
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"                          >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $TAG at $(git rev-parse --short HEAD)"

      - name: Install Rust toolchain
        # `rustup show` honours rust-toolchain.toml, which pins the compiler DATE and
        # names every target and component the four ports need. This step used to be
        # followed by a `rustup target add` for the three non-x86 targets and a
        # `rustup component add llvm-tools`, because the pin file described only the
        # x86 build. Both are gone: the pin file describes the whole build now.
        #
        # Deleting them is the point, not tidying. A step here that installs what the
        # pin file should have installed makes CI pass over a pin file that no longer
        # works, while a developer with a clean checkout cannot build three of the four
        # ports. The gap is then invisible to exactly the thing meant to catch it. With
        # the duplicates removed, CI builds from the same pin a contributor gets.
        run: rustup show

      - name: Install rust-objcopy
        # The ARM, AArch64 and RISC-V scripts turn the kernel ELF into a flat image
        # with `rust-objcopy -O binary`; the Pi and U-Boot loaders take an image, not
        # an ELF. The binary ships in `cargo-binutils`, a cargo install rather than a
        # rustup component, so it cannot live in rust-toolchain.toml; the `llvm-tools`
        # component it wraps does, and is declared there.
        run: cargo install cargo-binutils --locked

      - name: Fetch Limine (pinned)
        # tools/ is gitignored, so the bootloader is fetched rather than committed.
        #
        # FROM THE RELEASE ASSET, NOT A BRANCH. An earlier version cloned a
        # `v12.3.1-binary` branch; no such branch exists. Limine's `-binary` branches
        # stop at v11.x, and from 12.x the binaries ship as a release asset - which is
        # what README.md already tells a human to download. The tarball unpacks to
        # `limine-binary/`.
        #
        # NO `make` HERE, unlike a Linux runner: the asset carries a PREBUILT host tool
        # for Windows (`limine-tool-windows-x86/limine.exe`), and `osdev` looks for
        # exactly that name on this platform (`if cfg!(windows) { limine.exe }`).
        # BOOTX64.EFI alone is not enough - the host tool writes the boot sectors.
        run: |
          set -e
          URL="https://github.com/limine-bootloader/limine/releases/download/${LIMINE_VERSION}/limine-binary.tar.xz"
          curl -sSLf -o limine-binary.tar.xz "$URL"
          mkdir -p tools
          tar -xJf limine-binary.tar.xz -C tools
          mv tools/limine-binary tools/limine
          cp tools/limine/limine-tool-windows-x86/limine.exe tools/limine/limine.exe
          test -f tools/limine/limine.exe
          test -f tools/limine/BOOTX64.EFI
          test -f tools/limine/limine-bios.sys

      # ---- the same enforcement layer a local build runs -------------------------
      # A release is the worst possible time to discover a checker was failing.
      - name: Enforcement layer (source-only checks)
        run: |
          set -e
          for c in commandments unsafe_check dash_check arch_boundary_check arch_seam_check \
                   shared_surface_check contract_check doc_refs facts_check site_check; do
            echo "--- $c"
            python3 "scripts/$c.py"
          done

      # ---- build the four ports ---------------------------------------------------
      - name: Build x86_64 image
        run: cargo run -q -p osdev -- image

      - name: Build arm32 (Raspberry Pi 2)
        # --release is not optional here: a debug ARM build crash-loops `fs`, whose
        # service_main frame does not fit the 256 KiB user stack.
        run: python3 scripts/arm_build.py --release

      - name: Build aarch64 (Raspberry Pi 4)
        run: python3 scripts/pi4_build.py --release

      - name: Build riscv64 (StarFive VisionFive 2 Lite)
        run: python3 scripts/riscv_build.py --release --visionfive

      - name: Enforcement layer (checks that need built binaries)
        # These read target/<triple>/release: whether every managed service is really
        # embedded, whether the supervisor is NEWER than what it embeds (the trap
        # that shipped stale services on both Pi ports), and whether each service's
        # frames fit the stack it is given. They cannot run before a build, and are
        # meaningless if they do.
        run: |
          set -e
          for c in service_embed_check embed_order_check stack_fit_check; do
            echo "--- $c"
            python3 "scripts/$c.py"
          done

      - name: Collect
        run: |
          set -e
          V="${{ steps.v.outputs.tag }}"
          mkdir -p dist
          cp build/os-usb.img                      "dist/godspeed-os-$V-x86_64.img"
          cp build/kernel7.img                     "dist/godspeed-os-$V-arm32-pi2-kernel7.img"
          cp build/kernel8.img                     "dist/godspeed-os-$V-aarch64-pi4-kernel8.img"
          cp build/godspeed-riscv64-visionfive.img "dist/godspeed-os-$V-riscv64-visionfive.img"
          cp build/config-pi2.txt build/config-pi4.txt dist/

      # ---- THE GATE ---------------------------------------------------------------
      - name: Verify every image was stamped with the tag's commit
        # This is the step the whole workflow is built around. Each image must carry
        # the short sha of the commit being released, and nothing else can be
        # asserted about it from the outside: same name, same size, wrong contents is
        # exactly what a mixed build looks like.
        run: |
          set -e
          SHA="${{ steps.v.outputs.sha }}"
          bad=0
          for f in dist/*.img; do
            if grep -qa "$SHA" "$f"; then
              echo "  OK    $(basename "$f")  carries $SHA"
            else
              echo "  FAIL  $(basename "$f")  does NOT carry $SHA"; bad=1
            fi
          done
          [ "$bad" -eq 0 ] || { echo "release artefacts do not match the tagged commit"; exit 1; }

      - name: Package
        # 7-Zip, not xz/zip: Git Bash on a Windows runner ships neither, and 7z is
        # preinstalled. This only affects how the artefacts are WRAPPED - the images
        # inside are the bytes the gate above just verified.
        run: |
          set -e
          V="${{ steps.v.outputs.tag }}"
          cd dist
          7z a -txz -bso0 -bsp0 "godspeed-os-$V-x86_64.img.xz"  "godspeed-os-$V-x86_64.img"
          7z a -tzip -bso0 -bsp0 "godspeed-os-$V-x86_64.img.zip" "godspeed-os-$V-x86_64.img"
          rm -f "godspeed-os-$V-x86_64.img"
          # The Pi zips carry the config.txt the firmware needs; a kernel alone does
          # not boot either board.
          cp config-pi2.txt config.txt
          7z a -tzip -bso0 -bsp0 "godspeed-os-$V-arm32-pi2.zip"   "godspeed-os-$V-arm32-pi2-kernel7.img"   config.txt
          rm -f config.txt
          cp config-pi4.txt config.txt
          7z a -tzip -bso0 -bsp0 "godspeed-os-$V-aarch64-pi4.zip" "godspeed-os-$V-aarch64-pi4-kernel8.img" config.txt
          rm -f config.txt config-pi2.txt config-pi4.txt
          # The VisionFive equivalent is the extlinux stanza: the kernel goes on the
          # stock ESP and a label is APPENDED, never replacing what is there.
          cp ../boot/visionfive/extlinux-on-stock-esp.conf extlinux.conf
          7z a -tzip -bso0 -bsp0 "godspeed-os-$V-riscv64-visionfive.zip" "godspeed-os-$V-riscv64-visionfive.img" extlinux.conf
          rm -f extlinux.conf
          sha256sum * > "SHA256SUMS-$V"
          ls -l

      - name: Upload to the release
        # Pushing a tag can happen BEFORE the release exists - notes are written by
        # hand, so the usual order is tag, then write, then publish. Rather than
        # failing on that ordering, create a DRAFT if there is no release yet: the
        # artefacts are preserved and attached, and nothing is published under a
        # placeholder body.
        #
        # A PUBLISHED release is treated differently, and that difference is the point
        # of this step. `--clobber` replaces assets in place, which is right for a draft
        # nobody has downloaded and WRONG for a release people already hold: the bytes
        # behind a published URL would change silently, and SHA256SUMS would be rewritten
        # in the same breath to match the new bytes - so nothing would disagree afterwards
        # and nothing would report it. That is the exact failure the verify step above
        # exists to prevent, reintroduced one step later.
        #
        # So: a draft is clobbered freely; a published release is REFUSED unless a human
        # dispatches the run with overwrite_published=true. The refusal is loud and says
        # what to do instead (invariant 12). Nothing is lost either way - the next step
        # keeps the artefacts on the run itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${{ steps.v.outputs.tag }}"
          OVERRIDE="${{ github.event.inputs.overwrite_published }}"

          if ! gh release view "$V" >/dev/null 2>&1; then
            echo "no release for $V yet - creating a DRAFT to hold the artefacts"
            gh release create "$V" --draft --title "$V"               --notes "Draft created by the release workflow to hold build artefacts. Write the notes and publish."
          else
            DRAFT=$(gh release view "$V" --json isDraft -q .isDraft)
            echo "release $V already exists (draft: $DRAFT)"
            if [ "$DRAFT" != "true" ] && [ "$OVERRIDE" != "true" ]; then
              echo "::error::$V is PUBLISHED. Refusing to replace its assets: people may already have"
              echo "::error::downloaded them, and SHA256SUMS would be rewritten to match the new bytes,"
              echo "::error::so nothing afterwards would disagree. Cut a new tag instead - or re-run"
              echo "::error::from the Actions tab with overwrite_published=true if you really mean to"
              echo "::error::replace the artefacts of a published release."
              echo "The built artefacts are still attached to this run - see the next step."
              exit 1
            fi
          fi
          gh release upload "$V" dist/* --clobber

      - name: Keep the artefacts on the run too
        # So a failed or manual run still leaves something to inspect without
        # touching the release.
        uses: actions/upload-artifact@v4
        with:
          name: godspeed-os-${{ steps.v.outputs.tag }}
          path: dist/
          if-no-files-found: error
