name: mutation

on:
  workflow_dispatch:  # paused: re-add push/branches: [main] + schedule/cron when CI minutes are available

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-mutants-27.0.0

      # PINNED: another version generates a different mutant set, and the survivor baseline was
      # made with this one (2026-10-27). An install failure fails the job instead of being hidden.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.0.0

      # Run mutations against the kernel lib target only. kernel/mutants.toml names the files
      # (an include list: the hardware-free code lib.rs compiles for the host).
      #
      # This step used to end `|| true`, so a run could never fail. It now fails when the
      # survivors differ from kernel/mutants-survivors.txt in EITHER direction: a new survivor
      # (a test got weaker, or new code arrived untested) or a listed one now caught (delete it,
      # so the list only shrinks). scripts/mutants_check.py is the ratchet (backlog/90 E3).
      - name: Run mutation tests
        shell: bash
        run: |
          set +e
          cargo mutants --package kernel --config kernel/mutants.toml --jobs 4 -- --lib 2>&1 | tee mutation-report.txt
          set -e
          python3 scripts/mutants_check.py mutants.out

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.sha }}
          path: |
            mutation-report.txt
            mutants.out/
