# SPDX-License-Identifier: Apache-2.0
#
# The contract is the first thing to read, not the last. It is the whole answer to "what can this
# program do": the spawn request should grant exactly what is below - not one capability more (CLAUDE.md
# §13.6: authority comes from the SPAWN REQUEST, and this file is the reviewable statement of it).
#
# Compare it with `examples/00-hello`, which declares `log_write` alone. This program writes a file,
# reads it back and prints, so it asks for one more thing, BY NAME:
#
#   ipc_send = ["fs"]     it may talk to the filesystem service. Without this line,
#                         `godspeed::fs::Fs::new(&ctx)` still compiles and still returns a
#                         handle - and every call through it fails with `Unreachable`. The
#                         standard library makes the filesystem CONVENIENT; it cannot make it
#                         AVAILABLE. That distinction is the point of the whole design.
#
# Printing is `log_write`: `io::println` makes the kernel's ConsoleWrite call, and that is the
# capability it checks. This file used to ask for `console_push = true` "to put text on the screen",
# and that was wrong in the direction that matters - `console_push` is the authority to push bytes
# into the keyboard ring the shell reads as typed commands (SEC-2). The spawn row never granted it,
# and the output appeared anyway (`build/tests/examples_serial.log`). Corrected 2026-10-09.

name    = "stdlib-hello"
version = "0.1.0"

[resources.memory]
request = "32MiB"
limit   = "64MiB"

[capabilities]
log_write    = true        # the log (syscall 5) and the screen (ConsoleWrite, syscall 23)
ipc_send     = ["fs"]      # ask the filesystem service for files
