# SPDX-License-Identifier: Apache-2.0
#
# The contract is the first thing to read, not the last. It is the whole answer to "what can this
# program do", and the kernel mints exactly what is below - not one capability more (CLAUDE.md
# §13.6: authority comes from the SPAWN REQUEST, and this file is the reviewable statement of it).
#
# Compare it with `examples/00-hello`, which declares `log_write` alone. This program reads a file
# and prints, so it has to ask for two more things, BY NAME:
#
#   ipc_send = ["fs"]     it may talk to the filesystem service. Without this line,
#                         `godspeed::fs::Fs::new(&ctx)` still compiles and still returns a
#                         handle - and every call through it fails with `Unreachable`. The
#                         standard library makes the filesystem CONVENIENT; it cannot make it
#                         AVAILABLE. That distinction is the point of the whole design.
#
#   console_push = true   it may put text on the screen. Without it, `io::println` runs and
#                         nothing appears. If your output is missing, read this file first.

name    = "stdlib-hello"
version = "0.1.0"

[resources.memory]
request = "32MiB"
limit   = "64MiB"

[capabilities]
log_write    = true        # the kernel log ring + serial (syscall 5)
console_push = true        # write to the screen
ipc_send     = ["fs"]      # ask the filesystem service for files
