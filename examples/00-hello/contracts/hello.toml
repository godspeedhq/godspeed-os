# Service contract for `hello` - the minimal service (your first one; copy this folder).
# This is a BUILD-TIME declaration. Nothing parses TOML at spawn (13.6) - authority comes from
# the spawn request (the supervisor's spawn row). `scripts/contract_check.py` reconciles only
# `services/` contracts, so for an example this file is kept in step with its row by hand. A service
# can do ONLY what it was granted, and this states what that should be (Commandment VII).
name    = "hello"
version = "0.1.0"

[resources.memory]
# request = the minimum to START (stated for review: no spawn row carries it today; only `limit` is sent).
# limit   = the most it may ever allocate.
# Asking past `limit` returns AllocDenied (RECOVERABLE: the service can back off and
# degrade). Touching UNMAPPED memory is a page fault (FATAL: the service is killed).
# CLAUDE.md §10.2-§10.4.
request = "32MiB"
limit   = "64MiB"

[capabilities]
# Each line is an explicit grant - `hello` can do ONLY what is listed (Commandment VII,
# no ambient authority). Declaring nothing but log_write is the whole point.
#
# WHERE TO FIND THE FULL LIST: the declarable capabilities are defined in
# `contracts/schema/service.schema.json` (the JSON Schema that `osdev validate` enforces)
# and documented in `contracts/CLAUDE.md`. The ones you will meet first:
#   ipc_send     = ["peer", ...]      services this service may SEND IPC to
#   ipc_receive  = ["myname", ...]    endpoint names this service OWNS and receives on
#   log_write    = true               write the kernel log ring + serial (syscall 5)
#   hw_device / hw_pci_class / hw_pci_bar / hw_pci_irq   the device a driver is granted (drivers)
#   hw_mmio / hw_interrupt            a driver's window and IRQ, stated for REVIEW only (§12.3)
#   service_control = true            kill/restart services (supervisor, shell, control, chaos)
# plus console_push, resource_mint, cpu_clock and pci_cfg; the schema has the full list.
# Declare the MINIMUM your service needs - that minimum IS its security boundary.
log_write = true   # the ONLY authority hello holds

# No [placement] section - and that is deliberate. Omit it (as here) and the supervisor
# ROUND-ROBINS this service across the ready cores: the right default for almost every service,
# and what a first service should do. (Omitting does NOT mean "core 0"; it means "supervisor,
# spread me out.") Pin a core only with a real reason - cross-core parallelism (see examples/ping),
# a driver's interrupt locality (see examples/driver-skeleton and examples/e1000), or isolation -
# by adding a `[placement]` section with `core = N` (0-15); the supervisor then STRICTLY honors it
# (never reroutes; an unavailable core rejects the spawn). CLAUDE.md §9.2/§13.2, contracts/CLAUDE.md.
