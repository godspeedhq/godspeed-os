# Service contract for `e1000` - a read-only Intel e1000 NIC driver example. This is a BUILD-TIME
# declaration: nothing parses TOML at spawn (13.6). The kernel mints what the supervisor's SPAWN
# REQUEST asks for; for an example only the authority keys are
# reconciled against it (`IV-contract-authority`); memory, placement and peers are kept in step by hand
# (Commandment VII).
name    = "e1000"
version = "0.1.0"

[resources.memory]
# request = the minimum to START; limit = the most it may ever allocate. Past `limit` ->
# AllocDenied (recoverable); touching unmapped memory -> page fault (fatal). CLAUDE.md §10.2-§10.4.
request = "8MiB"
limit   = "32MiB"

[capabilities]
# Explicit grants only (Commandment VII). The FULL set of declarable capabilities is in
# `contracts/schema/service.schema.json` (validated by `osdev validate`) and `contracts/CLAUDE.md`:
# ipc_send, ipc_receive, log_write, the authority keys
# (console_push, resource_mint, service_control, cpu_clock, pci_cfg) and the driver hw_* keys.
#
# This driver declares NO hw_mmio: a NIC BAR would be granted at spawn only if the SUPERVISOR's spawn
# row for this service named a device CLASS, which the kernel resolves against its own bus scan (the
# same route xhci, ehci and block-driver take). Its one row (examples-test) names none, deliberately -
# `nic-driver` owns the NIC - so ctx.mmio() is None and it degrades. Reach a granted window via ctx.mmio(). A read-only driver needs no
# DMA arena and no hw_interrupt; a full NIC driver would add both (see driver-skeleton).
#
# CORRECTED 2026-09-26: this said the BAR is granted "BY NAME ... declared in the kernel's
# `service_hw` table", gated on the NIC "actually being an Intel e1000". `service_hw` has no arms left
# and the vendor whitelist is gone - step D removed both, so the kernel need not have been taught your
# device. A driver needs no kernel source change.
log_write = true   # may write the kernel log ring + serial (syscall 5); NOT to any service

# [placement] - OPTIONAL (omit -> the supervisor round-robins across cores). A driver usually pins
# for interrupt locality (§12.2) with `[placement]` and `core = N`; a pin is STRICT: honored, never
# rerouted, and an unavailable core REJECTS the spawn. CLAUDE.md §9.2/§13.2.
#
# Not pinned here: this read-only example takes no interrupt, and its spawn row (examples-test build)
# spawns it unpinned. The contract said `core = 1` while the row did not, which `contract_check.py`
# now catches (backlog/80 T8).
