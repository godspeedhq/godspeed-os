# Service contract for `resource-server` - demonstrates MINTING delegated resource capabilities
# (§7.10, "a file is a capability"). This is a BUILD-TIME declaration, not what the kernel
# reads at spawn - nothing parses TOML there (13.6). It is reconciled against the authority
# really granted by `scripts/contract_check.py` (Commandment VII, no ambient authority).
name    = "resource-server"
version = "0.1.0"

[resources.memory]
# request = the minimum to START; limit = the most it may ever allocate. Past `limit` ->
# AllocDenied (recoverable); touching unmapped memory -> page fault (fatal). CLAUDE.md §10.2-§10.4.
request = "32MiB"
limit   = "64MiB"

[capabilities]
# Explicit grants only - this service can do ONLY what is listed (Commandment VII, no ambient
# authority). The FULL set of declarable capabilities is in `contracts/schema/service.schema.json`
# (validated by `osdev validate`) and `contracts/CLAUDE.md`. The options are: ipc_send,
# ipc_receive, log_write, hw_mmio, hw_interrupt, hw_pio (+ service_control, supervisor-only).
ipc_receive = ["resource-server"]  # OWNS its endpoint - a cap holder's `resource_invoke` is routed here, badged
ipc_send    = ["holder"]           # may SEND to `holder` - so it can GRANT holder the minted resource cap
                                   # (an embedded cap, §8.5). holder is the client half (examples/holder);
                                   # the supervisor spawns holder FIRST so this peer resolves at our spawn.
log_write   = true                 # may write the kernel log ring + serial (syscall 5); NOT to any service
# `resource_mint` - MINT delegated resource capabilities (7.10, gated by RESOURCE_MINT). This is
#                   the whole point of this example and it was NOT declared here, while the
#                   comments above promised "the kernel mints EXACTLY these capabilities" and
#                   "this service can do ONLY what is listed". The list was short by the one
#                   capability the example exists to demonstrate. Found by `IV-contract-authority`
#                   on its first run, 2026-09-14.
resource_mint = true

# RESOURCE_MINT arrives in the SPAWN REQUEST, checked against what the supervisor may itself delegate
# (`SUPERVISOR_DELEGATABLE`). The `resource_mint = true` line above is the build-time DECLARATION of
# that, reconciled by `IV-contract-authority`; nothing parses TOML at spawn (13.6). Without the grant
# `ctx.resource_mint` returns None and this example idles (graceful degrade, 7.10 / 3.12).
#
# CORRECTED 2026-09-26, and this one was self-contradicting. It read: "the authority to MINT resources
# (RESOURCE_MINT) is NOT a contract capability field - it is not in the schema and cannot be requested
# here" - NINE LINES BELOW `resource_mint = true`, in this file, and the schema has it at
# `contracts/schema/service.schema.json`. It then cited a `service_hw` arm
# (`"fs" | "net-stack" | "resource-server" => (HwClass::None, true)`) which no longer exists; that
# table has no arms. So one file told a reader: here is the field, the field does not exist, and here
# is the kernel table that grants it instead, which is also gone. The field was added by
# `IV-contract-authority` on 2026-09-14 and the paragraph denying it was never touched.

# No [placement] section - omit it (as here) and the supervisor ROUND-ROBINS this service across the
# ready cores: the right default for almost every service. (Omitting does NOT mean "core 0".) Pin a
# core only with a real reason by adding `[placement]` with `core = N` (0-15); a pin is STRICT
# (honored, never rerouted; an unavailable core rejects the spawn). CLAUDE.md §9.2/§13.2.
