# A userspace device driver contract. It declares EXACTLY the hardware it touches and nothing
# more (Commandment VII: no ambient authority). Nothing parses this file at spawn (CLAUDE.md 13.6):
# the kernel grants only the window and interrupt of the device CLASS the supervisor's spawn row
# names, so the driver can reach nothing else. Declare only what your device actually needs.
name    = "driver-skeleton"
version = "0.1.0"

[resources.memory]
# request = the minimum to START; limit = the most it may ever allocate. Past `limit` ->
# AllocDenied (recoverable); touching unmapped memory -> page fault (fatal). CLAUDE.md §10.2-§10.4.
request = "8MiB"
limit   = "16MiB"

[capabilities]
# Explicit grants only (Commandment VII). The FULL set of declarable capabilities is in
# `contracts/schema/service.schema.json` (validated by `osdev validate`) and `contracts/CLAUDE.md`.
# The options: ipc_send, ipc_receive, log_write, the authority keys (console_push, resource_mint,
# service_control, cpu_clock, pci_cfg) and the hw_* keys. A driver uses the hw_* options:

# hw_mmio: the device's MMIO register window(s), as "0xBASE+0xSIZE" in hex. A STATEMENT for review,
# not the grant: the kernel maps the window of the device class the spawn request names, from its own
# bus scan, and never an address a request supplies (CLAUDE.md 13.6). Reach it via ctx.mmio().
hw_mmio      = ["0xfeb00000+0x1000"]

# hw_interrupt: the device's IRQ line(s), each 0-255, stated for review the same way. The kernel
# routes the granted class's interrupt to the driver's endpoint as an IPC message (§12.2); the driver recv()s it and re-arms with
# gs::driver::irq::Irq::granted(ctx).rearm(ctx) - the vector the kernel granted, never one of ours.
hw_interrupt = [11]

# hw_pio is a DEAD key (the ATA-PIO backend was retired; the schema keeps it only until v2): never declare it.
# NOTE: a DMA arena is NOT a contract field - it is granted at spawn when the supervisor's spawn row
# names the driver's device CLASS (reach it via ctx.dma_region()). A new driver needs a spawn row,
# not a kernel change.
log_write    = true   # may write the kernel log ring + serial (syscall 5); NOT to any service

[placement]
# OPTIONAL in general (omit -> the supervisor round-robins across cores), but a driver usually
# DOES pin: the device's interrupt routes to whichever core the driver runs on (§12.2), so
# pinning keeps interrupt handling deterministic - a legitimate reason to set `core`. A pin is
# STRICT: honored, never rerouted; an unavailable core REJECTS the spawn. core is 0-15.
# CLAUDE.md §9.2/§13.2, §12.2.
core = 1   # a driver pins to the core its IRQ routes to (interrupt locality)
