# Service contract for `asker` - the request/reply CLIENT (the request side of the RPC pattern;
# `reply-server` is the reply side). This is a BUILD-TIME declaration, not what the kernel
# reads at spawn - nothing parses TOML there (13.6). `asker` can do only what the SPAWN
# REQUEST granted; for an example only the authority keys are
# reconciled against it (`IV-contract-authority`); memory, placement and peers are kept in step by hand
# (Commandment VII).
name    = "asker"
version = "0.1.0"

[resources.memory]
# request = the minimum to START; limit = the most it may ever allocate. Past `limit` ->
# AllocDenied (recoverable); touching unmapped memory -> page fault (fatal). CLAUDE.md §10.2-§10.4.
request = "32MiB"
limit   = "64MiB"

[capabilities]
# Explicit grants only - `asker` can do ONLY what is listed (Commandment VII, no ambient authority).
# The FULL set of declarable capabilities is in `contracts/schema/service.schema.json` (validated by
# `osdev validate`) and `contracts/CLAUDE.md`: ipc_send, ipc_receive, log_write, the
# authority keys (console_push, resource_mint, service_control, cpu_clock, pci_cfg) and the hw_* keys.
ipc_send    = ["reply-server"]   # may SEND a request to reply-server (the peer it calls)
ipc_receive = ["asker"]          # OWNS its endpoint (SPAWN_FLAG_REQ_RECV in its spawn row). The
                                 # kernel also gives it a REPLY MAILBOX, a second endpoint for
                                 # replies alone; the reply cap asker embeds in each request is a
                                 # SEND copy of that mailbox (of THIS endpoint only if it got no
                                 # mailbox), derived at runtime, granted per request (§8.5).
log_write   = true               # may write the kernel log ring + serial (syscall 5); NOT to any service

# No [placement] section: the supervisor ROUND-ROBINS asker across the ready cores - the right
# default. (Omitting does NOT mean "core 0".) A request/reply round-trip works the same on any core;
# the kernel routes the reply to whatever core asker landed on (identity over location, Invariant 11).
