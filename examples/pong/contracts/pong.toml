# Service contract for `pong` - the demo server. This is a BUILD-TIME declaration, not what the
# kernel reads at spawn - nothing parses TOML there (13.6). `pong` can do only what the SPAWN
# REQUEST granted; for an example only the authority keys are
# reconciled against it (`IV-contract-authority`); memory, placement and peers are kept in step by hand
# (Commandment VII).
name    = "pong"
version = "0.1.0"

[resources.memory]
# request = the minimum to START; limit = the most it may ever allocate. Past `limit` ->
# AllocDenied (recoverable); touching unmapped memory -> page fault (fatal). CLAUDE.md §10.2-§10.4.
request = "32MiB"
limit   = "64MiB"

[capabilities]
# Explicit grants only (Commandment VII). The FULL set of declarable capabilities is in
# `contracts/schema/service.schema.json` (validated by `osdev validate`) and `contracts/CLAUDE.md`:
# ipc_send, ipc_receive, log_write, the authority keys
# (console_push, resource_mint, service_control, cpu_clock, pci_cfg) and the driver hw_* keys.
# pong is a PURE RECEIVER (recv + log), so it declares NO ipc_send. The kernel name directory
# records "pong" at spawn (and refreshes it on restart), so clients reacquire it by name through
# the directory with no push from pong.
ipc_receive = ["pong"]        # OWNS and receives on its own "pong" endpoint
log_write   = true            # may write the kernel log ring + serial (syscall 5); NOT to any service

# No [placement] section, so no STRICT pin. The supervisor's spawn row still PREFERS core 1 (it spawns
# pong there at boot, falling back to core 0), which is what puts ping and pong on different cores.
# pong may land on a DIFFERENT core after a restart, while its NAME stays stable (identity over
# location, Commandment V / Invariant 11).
# Add `[placement] core = N` (0-15) only with a real reason to pin (cross-core parallelism, a
# driver's interrupt locality, or isolation); a pin is STRICT (honored, never rerouted; an
# unavailable core rejects the spawn). CLAUDE.md §9.2/§13.2, contracts/CLAUDE.md.
