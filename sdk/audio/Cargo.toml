[package]
name = "godspeed-audio"
version = "0.1.0"
edition = "2021"

# What every audio driver shares, and the wire protocol the shell's `audio` speaks to them: the
# request vocabulary (`wire`), the test tone (`sine`) and `/audio.settings` (`settings`).
# A library, not a service: no entry point, nothing spawned.
[lib]
name = "godspeed_audio"
path = "src/lib.rs"

[dependencies]
godspeed-sdk = { path = "../rust" }
# `gs::fs` for the settings file and `gs::driver` for its retry pause; nothing in `stdlib` depends on
# this crate, so there is no cycle.
godspeed = { path = "../../stdlib/rust" }
