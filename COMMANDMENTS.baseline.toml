# The pinned kernel surface, and the recorded exemptions to the mechanical Commandment checks.
#
# THIS FILE MAY ONLY EVER SHRINK. It is the same instrument as the grandfathered `unsafe` floors of
# CLAUDE.md §18.5: counts may DECREASE freely, and may increase only by amending the constitution with
# a written rationale. `scripts/commandments.py` enforces the ratchet in both directions - too many
# violations fails, and so does an entry that is looser than reality or matches nothing at all.
#
# An exemption is legitimate ONLY if it cites a CLAUDE.md amendment that already accepts the violation.
# If nothing in the constitution accepts it, there is no exemption to write: fix it, or amend the
# constitution deliberately. That is what stops this file becoming where violations go to be forgotten.

[kernel]
#
# TWO KINDS OF ENTRY LIVE HERE, and they are not the same claim. `--report` labels every check with
# which it is, because a green build means something different for each.
#
#   RULE    a fixed truth; any deviation is a FAILURE. The value IS the law. There are few of these,
#           and where the law is written down elsewhere they are DERIVED rather than copied - the six
#           responsibilities come from CLAUDE.md §4.3, chaos's apparatus from chaos's own spawn calls,
#           so neither appears below at all.
#
#   RECORD  a snapshot, NOT an endorsement. 49 syscalls is not a claim that 49 is right - only that a
#           fiftieth must be deliberate, because Commandment I says to ask "why isn't this a service?"
#           BEFORE proposing a kernel change, and this is what forces the question to be asked. These
#           legitimately change: supporting a new CPU adds arch files, and that is welcome.
#
#   DEBT    a distance from where it should be, which may only shrink.
#

# A crate the kernel links is code running in ring 0 with the kernel's full authority, having passed
# none of these checks. "Why isn't this a service?" applies to a dependency more sharply than to a
# subsystem, because a service could link it under isolation instead.
dependencies = [
    "bitflags",
    "limine",
    "noto-sans-mono-bitmap",
    "portable-atomic"
]

# A feature flag is a switch on what the kernel IS: a different scheduler entry, a different boot
# path, a service the kernel spawns itself. Test-only features count - a build the kernel can be put
# into is a build someone can ship.
features = [
# §22 Tests 2 and 3 (capability enforcement, IPC routing), pre-scheduler. Pinned because this
# feature REMOVES code from a shipping kernel rather than adding any: the tests used to run in every
# boot, where they could panic the machine on an assertion and left ResourceId(0xDEAD/0xDEAF/0xABCD)
# and EndpointId(999)/(998) registered in the LIVE tables, 999 holding 16 messages forever. They are
# now off by default and turned on only by `osdev test identity`, which is the build that asserts on
# their output.
"kernel-selftest",
    "arm-autochaos",
    "arm-fault-test",
    "arm-sched-demo",
    "arm-sched-ipc",
    "arm-supervisor",
    "iommu-fault-test",
    "memmap-clamp-test",
    "mmio-map-fault-test",
    "pi4",
    "pi4-demo-services",
    "pi4-sched-demo",
    "pi4-smp",
    "pi4-supervisor",
    "test-bad-elf",
    "test-bad-elf-brutal",
    "test-bad-supervisor"
]

# DEBT, NOT AN ALLOWANCE. This list may only ever SHRINK. Kernel responsibility does not expand, so
# there is no "add it deliberately" path here: do not add a line.
#
# The kernel holds a `service_config` for each of these - memory limit, placement core, capabilities,
# send peers, embedded ELF. Loading a task is mechanism and belongs to the kernel; a CATALOGUE of what
